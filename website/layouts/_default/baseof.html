<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Params.siteName }} · {{ site.Params.siteNameCN }}{{ else }}{{ .Title }} · {{ site.Params.siteName }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  {{ with .OutputFormats.Get "rss" }}
  <link rel="alternate" type="application/rss+xml" title="{{ site.Params.siteName }}" href="{{ .Permalink }}">
  {{ end }}

  <script>
    (function () {
      try {
        var t = localStorage.getItem("wli-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  {{ partial "header.html" . }}

  <main id="main">{{ block "main" . }}{{ end }}</main>

  {{ partial "footer.html" . }}

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("themeToggle");
      function paint() {
        if (!btn) return;
        btn.textContent = root.getAttribute("data-theme") === "dark" ? "☀" : "☾";
        btn.setAttribute("aria-label", root.getAttribute("data-theme") === "dark" ? "切到亮色" : "切到深色");
      }
      paint();
      if (btn) btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("wli-theme", next); } catch (e) {}
        paint();
      });
      var mt = document.getElementById("menuToggle"), nav = document.getElementById("siteNav");
      function setMenu(open) {
        if (!nav || !mt) return;
        nav.classList.toggle("open", open);
        document.body.classList.toggle("nav-open", open);
        mt.setAttribute("aria-expanded", open ? "true" : "false");
      }
      if (mt && nav) {
        mt.addEventListener("click", function () { setMenu(!nav.classList.contains("open")); });
        // 点链接、按 Esc、或者转回桌面宽度时收起，避免遮罩留在屏幕上
        nav.addEventListener("click", function (e) { if (e.target.tagName === "A") setMenu(false); });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });
        var mq = window.matchMedia("(min-width: 861px)");
        (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(function () { if (mq.matches) setMenu(false); });
      }
    })();
  </script>
</body>
</html>
