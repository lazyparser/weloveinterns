{{ define "main" }}
<header class="page-head">
  <div class="wrap-wide">
    <div class="crumb"><a href="{{ "" | relURL }}">首页</a> / {{ .Title }}</div>
    <h1>{{ .Title }}</h1>
    {{ with .Params.sub }}<div class="sub">{{ . }}</div>{{ end }}
  </div>
</header>
<div class="wrap-wide">
  <article class="prose">{{ .Content }}</article>
</div>
{{ end }}
