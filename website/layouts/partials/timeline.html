{{/* 时间线：数据来自 data/timeline.yaml */}}
<div class="tl-legend">
  <span style="color:var(--violet)"><i></i>仓库</span>
  <span style="color:var(--copper)"><i></i>组织</span>
  <span style="color:var(--cyan)"><i></i>培养体系</span>
  <span style="color:var(--green)"><i></i>人</span>
</div>
<div class="timeline">
  {{ range site.Data.timeline }}
  <div class="tl-item" data-kind="{{ .kind }}">
    <div class="tl-date">{{ .date }}</div>
    <div class="tl-title">{{ .title }}</div>
    <p class="tl-desc">{{ .desc }}</p>
    {{ with .evidence }}<p class="tl-ev">证据：{{ . }}</p>{{ end }}
  </div>
  {{ end }}
</div>
