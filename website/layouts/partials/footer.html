<footer class="site-footer">
  <div class="wrap-wide">
    <div class="footer-grid">
      <div>
        <strong>{{ site.Params.siteName }}</strong>（{{ site.Params.siteNameCN }}）<br>
        {{ i18n "footer.tagline" }}
      </div>
      <div>
        <a href="{{ site.Params.repo }}" target="_blank" rel="noopener">{{ i18n "footer.repo" }}</a> ·
        <a href="{{ site.Params.jiachenSite }}" target="_blank" rel="noopener">{{ i18n "footer.jiachen" }}</a> ·
        <a href="{{ "sources/" | relLangURL }}">{{ i18n "footer.sources" }}</a> ·
        <a href="{{ "rss.xml" | relLangURL }}">{{ i18n "footer.rss" }}</a>
      </div>
    </div>
    <div class="footer-note">
      {{ i18n "footer.licenseNote" }}
    </div>
  </div>
</footer>
