{{/* 甲辰计划人才培养支撑体系：五件套闭环（据 CCF 2026 演讲 p44 自绘，非截图/非转载） */}}
<div class="stones">
  <svg viewBox="0 0 780 522" role="img" aria-label="{{ i18n "stones.aria" }}">
    <defs>
      <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/>
      </marker>
      <marker id="arwKey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gold)"/>
      </marker>
    </defs>

    <!-- 闭环箭头：顺时针 -->
    <path class="arc" marker-end="url(#arw)" d="M 482 96 C 552 118 566 168 550 206"/>
    <path class="arc" marker-end="url(#arw)" d="M 590 280 C 588 336 572 386 548 432"/>
    <path class="arc" marker-end="url(#arw)" d="M 428 469 L 360 469"/>
    <path class="arc" marker-end="url(#arw)" d="M 252 434 C 240 388 234 340 240 284"/>
    <path class="arc-key" marker-end="url(#arwKey)" d="M 252 218 Q 302 132 372 108"/>

    <!-- 公开免费培训课程体系 -->
    <g>
      <rect class="box" x="300" y="38" width="180" height="68" rx="12"/>
      <text class="node-label" x="390" y="68" text-anchor="middle">{{ i18n "stones.courses" }}</text>
      <text class="node-sub" x="390" y="88" text-anchor="middle">{{ i18n "stones.coursesSub" }}</text>
    </g>

    <!-- 开源实习生联合培养 -->
    <g>
      <rect class="box" x="512" y="212" width="188" height="68" rx="12"/>
      <text class="node-label" x="606" y="242" text-anchor="middle">{{ i18n "stones.internship" }}</text>
      <text class="node-sub" x="606" y="262" text-anchor="middle">{{ i18n "stones.internshipSub" }}</text>
    </g>

    <!-- 开发板漂流 -->
    <g>
      <rect class="box" x="430" y="434" width="188" height="68" rx="12"/>
      <text class="node-label" x="524" y="464" text-anchor="middle">{{ i18n "stones.board" }}</text>
      <text class="node-sub" x="524" y="484" text-anchor="middle">{{ i18n "stones.boardSub" }}</text>
    </g>

    <!-- 甲辰计划人才背书 -->
    <g>
      <rect class="box" x="164" y="434" width="188" height="68" rx="12"/>
      <text class="node-label" x="258" y="464" text-anchor="middle">{{ i18n "stones.endorse" }}</text>
      <text class="node-sub" x="258" y="484" text-anchor="middle">{{ i18n "stones.endorseSub" }}</text>
    </g>

    <!-- 五色石工程（整合层，高亮） -->
    <g>
      <rect class="box-key" x="62" y="212" width="188" height="68" rx="12"/>
      <text class="node-label" x="156" y="242" text-anchor="middle">{{ i18n "stones.project" }}</text>
      <text class="node-sub" x="156" y="262" text-anchor="middle">{{ i18n "stones.projectSub" }}</text>
    </g>

  </svg>
  <p class="stones-cap">{{ i18n "stones.caption" }}</p>
</div>
