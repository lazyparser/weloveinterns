{{ define "main" }}
<header class="page-head">
  <div class="wrap-wide">
    <div class="crumb"><a href="{{ "" | relLangURL }}">{{ i18n "crumb.home" }}</a> / <a href="{{ "blog/" | relLangURL }}">{{ i18n "nav.blog" }}</a> / {{ .Title }}</div>
    <h1>{{ .Title }}</h1>
    <div class="sub">
      {{ .Date.Format "2006-01-02" }}
      {{ with .Params.tags }}　{{ range . }}<span class="proj-tag">{{ . }}</span>{{ end }}{{ end }}
    </div>
  </div>
</header>
<div class="wrap-wide">
  <article class="prose">{{ .Content }}</article>
  <p style="margin-top:2.4rem"><a class="btn" href="{{ "blog/" | relLangURL }}">{{ i18n "blog.back" }}</a></p>
</div>
{{ end }}
