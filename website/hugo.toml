baseURL = "https://weloveinterns.org/"
title = "We Love Interns"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
timeZone = "Asia/Shanghai"
summaryLength = 60
defaultContentLanguage = "zh"
buildFuture = true

[params]
  siteName = "We Love Interns"
  siteNameCN = "爱实习生的我们"
  description = "weloveinterns 是一个从 2017 年写到今天的仓库，也是一条关于中科重德、PLCT 实验室、甲辰计划与五色石工程的长故事。铁打的联合培养计划，流水的实习生。"
  repo = "https://github.com/lazyparser/weloveinterns"
  jiachenSite = "https://rv2036.org"
  buildersNetwork = "https://github.com/rv2036/jiachen-builders-network"
  boardWandering = "https://github.com/rv2036/riscv-board-wandering"
  contactEmail = "wuwei@rv2036.org"
  license = "CC BY-SA 4.0"
  licenseURL = "https://creativecommons.org/licenses/by-sa/4.0/deed.zh-hans"
  navHome = "首页"
  moto = "让荣光落于刀锋之上"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    strikethrough = false
    linkify = true
    table = true
    typographer = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputFormats.rss]
  mediaType = "application/rss+xml"
  baseName = "rss"
  isPlainText = false

[services.rss]
  limit = 30
