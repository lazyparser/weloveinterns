[sec.shise.title]
other = "Five-Colour Stone Project"
[sec.shise.lead]
other = "On the first day of the Bingwu year, 2026, Project Jiachen announced the RISC-V Global Leadership Training Programme, known as the Five-Colour Stone Project: taking its meaning from Nüwa smelting five-colour stones to mend the sky, it works on a ten-year cycle and moves from 'finding and screening talent' to 'training talent systematically and over the long term'."
[btn.shiseMore]
other = "Five-Colour Stone: why it exists, and the evidence →"
