[sec.jiachen.title]
other = "What Project Jiachen is"
[sec.jiachen.lead]
other = "Project Jiachen (RISC-V Prosperity 2036) was founded on Chinese New Year's Eve 2024 by a group of RISC-V software and chip teams in China. It has no financial entity, no membership fee and no board — just one lead and a shared vision: a cooperation network built on consensus."
[sec.jiachen.quote]
other = "Before the next Bingchen year (2036, the Year of the Dragon), build on RISC-V an open standard system and open-source system software stack that covers the whole information industry, from data centres to desktop offices, from wearables to the intelligent IoT, so that the RISC-V hardware and software ecosystem reaches or exceeds the maturity of other mainstream architectures."
[sec.jiachen.quoteSrc]
other = "— Project Jiachen vision and mission"
[sec.jiachen.goals]
other = "The goal is to bring together more than 100 chip and solution vendors and more than 500 software companies, complete RISC-V adaptation and optimisation in more than 18 foundational industries, and jointly port and deploy more than 1,000 important industry and commercial applications; and to build a RISC-V talent identification system connecting more than 10,000 professionals."

[card.network.tag]
other = "How it is organised"
[card.network.title]
other = "A circle of friends around a shared vision"
[card.network.desc]
other = "Join by endorsing the vision, leave whenever you like; members are equal, with no hierarchy; the more you contribute, the more influence you have."
[card.finance.tag]
other = "Financial model"
[card.finance.title]
other = "Run like an open-source project"
[card.finance.desc]
other = "No financial entity, no membership fee, no board; members start projects and raise funds themselves, and PLCT Lab and Kubuds provide the initial momentum."
[card.eco.tag]
other = "Ecosystem"
[card.eco.title]
other = "60+ members"
[card.eco.desc]
other = "From chip vendors and distribution communities to universities and research institutes, several independent projects have already been launched under Project Jiachen."

[sec.program.title]
other = "Joint open-source internship programme"
[sec.program.lead]
other = "Launched on 8 June 2024, the programme starts from a very practical sentence: let member organisations accelerate the RISC-V ecosystem work that matters to their own business, with the smallest possible spend of money and management resources."
[trio.vision.title]
other = "Vision"
[trio.vision.desc]
other = "Every student who wants to enter the open-source world gets a real stepping stone: a mentor, a real upstream task, a merged PR, a stipend."
[trio.mission.title]
other = "Mission"
[trio.mission.desc]
other = "Be the interface between companies and young people: companies provide positions and mentors; we screen, train, grade and endorse. Since the Jiachen Dragon year, more than 2,000 internship places have opened each year."
[trio.achievement.title]
other = "Achievements"
[trio.achievement.desc]
other = "Verifiable numbers for positions, internships, community mentors and maintainers; more than 10 companies and institutions offer positions."
[sec.program.principlesTitle]
other = "Three things we don't look at, one we insist on"
[sec.program.principles]
other = "We don't look at 985 or 211, at your major or your year ranking; selection is based entirely on ability and potential. We believe in women's potential in STEM and reserve at least 30% of internship places for women applicants."
[sec.program.grading]
other = "There is one criterion: can you complete the day-to-day development work of a joint-programme host? Abilities the work does not need are outside the assessment. Capability levels run LV0–LV5 and are assessed by the lead as a 'benevolent dictator'; LV4 is the default level for a full-time hire."
[sec.program.gradingMore]
other = "See the full grading and process →"

