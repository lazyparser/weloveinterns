[sec.jiachen.title]
other = "甲辰计划是什么"
[sec.jiachen.lead]
other = "甲辰计划（RISC-V Prosperity 2036）诞生于 2024 年除夕，由国内多家 RISC-V 软件与芯片团队联合发起。它没有财务实体、没有会员费、没有董事会，只有一个主理人和一份共同愿景 —— 一个基于共识的合作网络。"
[sec.jiachen.quote]
other = "在下一个丙辰年（2036 龙年）之前，基于 RISC-V 实现从数据中心到桌面办公、从移动穿戴到智能物联网全信息产业覆盖的开放标准体系及开源系统软件栈，使 RISC-V 软硬件生态达到或超过其它主流架构的生态成熟度。"
[sec.jiachen.quoteSrc]
other = "—— 甲辰计划愿景与使命"
[sec.jiachen.goals]
other = "目标是联合 100 家以上芯片及方案厂商、500 家以上软件企业，在 18 个以上基础关键行业领域完成面向 RISC-V 的适配与优化，合作完成超过 1000 款重要行业及商业软件的移植与部署；并建立 RISC-V 人才识别体系，连接超过 1 万名专业人才。"
[card.network.tag]
other = "组织方式"
[card.network.title]
other = "基于共同愿景的「朋友圈」"
[card.network.desc]
other = "认可愿景即可加入，随时可以退出；成员地位平等、无等级结构；贡献越大，影响力越大。"
[card.finance.tag]
other = "财务模式"
[card.finance.title]
other = "开源项目式运作"
[card.finance.desc]
other = "无财务实体、无会员费用、无董事会；成员自行发起项目并筹措资金，PLCT 实验室与苦芽科技提供初始动能。"
[card.eco.tag]
other = "生态"
[card.eco.title]
other = "60+ 家成员"
[card.eco.desc]
other = "从芯片厂商、发行版社区到高校与研究机构，依托甲辰计划已发起多个独立项目。"

[sec.program.title]
other = "开源实习生联合培养"
[sec.program.lead]
other = "2024 年 6 月 8 日发布的项目，出发点是一句很务实的话：让成员单位用最小的金钱和管理资源投入，完成对自家企业有用的 RISC-V 生态建设目标的加速。"
[trio.vision.title]
other = "愿景"
[trio.vision.desc]
other = "让每一个想进入开源世界的学生，都能拿到一块真实的垫脚石：有导师、有真实的上游任务、有被 merge 的 PR、有实习费。"
[trio.mission.title]
other = "使命"
[trio.mission.desc]
other = "做企业与年轻人之间的接口：企业拿出岗位与 mentor，我们负责筛选、培养、评级与背书。自甲辰龙年起，每年开放 2000 名以上实习名额。"
[trio.achievement.title]
other = "成就"
[trio.achievement.desc]
other = "累计岗位、累计实习、社区导师与维护者数量的可核对数字；超过 10 家公司和机构提供岗位。"
[sec.program.principlesTitle]
other = "三条不看的，一条坚持的"
[sec.program.principles]
other = "不看 985 或 211，不看专业和年级排名，完全按照工作能力和潜力选拔；相信女性在 STEM 领域的潜力，预留至少 30% 的实习生岗位给女性应聘者。"
[sec.program.grading]
other = "评价标准只有一条：能不能完成联合培养单位的日常开发任务 —— 用不到的能力，不在评价范围。能力分级是 LV0–LV5，由主理人以「仁慈独裁者」方式评定；LV4 是默认的全职招聘等级。"
[sec.program.gradingMore]
other = "看完整的分级与流程 →"

[sec.interns.title]
other = "杰出实习生"
[sec.interns.lead]
other = "名单上不是「若干名优秀实习生」，是一个个具体的人。每一张卡片背后是一次被 merge 的提交，一份能被上游认可的产出。"
[btn.allInterns]
other = "完整名单（含 senior interns 与寄语原文）→"
[sec.mentors.title]
other = "社区导师"
[sec.mentors.lead]
other = "实习需要跟着一位师父 —— 只有获得一位 mentor 的认可，实习契约才成立。这一节陆续补充。"
[btn.allMentors]
other = "全部导师 →"
[sec.shise.title]
other = "五色石工程"
[sec.shise.lead]
other = "2026 年丙午正月初一，甲辰计划发布 RISC-V 全球领袖人才培养工程（简称五色石工程）：取女娲炼五色石补天之意，以十年为周期，从「寻找、筛选人才」升级为「系统性、长期性培养人才」。"
[btn.shiseMore]
other = "五色石工程：初衷与佐证 →"
[sec.projects.title]
other = "开源项目"
[sec.projects.lead]
other = "依托甲辰计划，成员组织发起了一批项目；下面另有一组推荐给实习生上手的开源仓库 —— 它们都是真实的上游，能拿到真实的 review。"
[projects.group1]
