[sec.jiachen.title]
other = "Что такое Проект Цзячэнь"
[sec.jiachen.lead]
other = "Проект Цзячэнь (RISC-V Prosperity 2036) появился в канун Нового года 2024-го: его совместно основали несколько китайских команд, работающих над программным обеспечением и чипами RISC-V. У проекта нет юридического лица, нет членских взносов и нет совета директоров — есть один руководитель и общее видение. Это сеть сотрудничества, построенная на консенсусе."
[sec.jiachen.quote]
other = "До следующего года Бин-чэнь (2036, год Дракона) построить на основе RISC-V открытую систему стандартов и стек системного ПО с открытым кодом, охватывающие всю информационную индустрию — от дата-центров до настольной работы, от носимых устройств до интеллектуального IoT, — и довести экосистему RISC-V, аппаратную и программную, до уровня зрелости других основных архитектур или выше него."
[sec.jiachen.quoteSrc]
other = "— Видение и миссия Проекта Цзячэнь"
[sec.jiachen.goals]
other = "Цель — объединить более 100 производителей чипов и готовых решений и более 500 софтверных компаний, завершить адаптацию и оптимизацию под RISC-V в более чем 18 базовых ключевых отраслях, совместно выполнить портирование и развёртывание более 1000 значимых отраслевых и коммерческих продуктов, а также построить систему выявления кадров RISC-V и связать более 10 000 специалистов."
[card.network.tag]
other = "Форма организации"
[card.network.title]
other = "«Круг друзей» на основе общего видения"
[card.network.desc]
other = "Достаточно разделять видение, чтобы присоединиться, и выйти можно в любой момент; участники равны, иерархии нет; чем больше вклад, тем больше влияния."
[card.finance.tag]
other = "Финансы"
[card.finance.title]
other = "Работа по модели открытого проекта"
[card.finance.desc]
other = "Нет юридического лица, членских взносов и совета директоров; участники сами запускают проекты и находят на них средства, а PLCT Lab и Kubuds дают начальный импульс."
[card.eco.tag]
other = "Экосистема"
[card.eco.title]
other = "60+ участников"
[card.eco.desc]
other = "От производителей чипов и сообществ дистрибутивов до университетов и исследовательских институтов: на базе Проекта Цзячэнь уже запущено несколько самостоятельных проектов."

[sec.program.title]
other = "Совместная программа стажировок"
[sec.program.lead]
other = "Программа, объявленная 8 июня 2024 года. Отправная точка — вполне практичная формулировка: дать организациям-участникам ускорить развитие экосистемы RISC-V, нужной их собственному бизнесу, при минимальных затратах денег и управленческих ресурсов."
[trio.vision.title]
other = "Видение"
[trio.vision.desc]
other = "Чтобы каждый студент, который хочет войти в мир open source, получил настоящую ступеньку: наставника, реальную upstream-задачу, смерженный PR и стипендию."
[trio.mission.title]
other = "Миссия"
[trio.mission.desc]
other = "Быть интерфейсом между компаниями и молодыми людьми: компании дают позиции и наставников, программа берёт на себя отбор, обучение, оценку и поручительство. Начиная с года Цзячэнь ежегодно открывается более 2000 стажёрских мест."
[trio.achievement.title]
other = "Результаты"
[trio.achievement.desc]
other = "Проверяемые цифры по числу позиций, стажировок, наставников и мейнтейнеров; более 10 компаний и организаций предоставляют позиции."
[sec.program.principlesTitle]
other = "Три вещи, на которые не смотрят, и одна, на которой настаивают"
[sec.program.principles]
other = "Не смотрят на 985 или 211, не смотрят на специальность и место в рейтинге — отбор идёт исключительно по способностям и потенциалу; программа верит в потенциал женщин в STEM и резервирует не менее 30% стажёрских мест для женщин."
[sec.program.grading]
other = "Критерий оценки один: способность выполнять повседневные задачи разработки в организациях-участниках — то, что этим организациям не нужно, в оценку не входит. Уровней шесть, LV0–LV5, их присваивает руководитель программы в порядке «благожелательного диктатора»; LV4 — уровень, на котором по умолчанию нанимают на полную ставку."
[sec.program.gradingMore]
other = "Уровни и процедура целиком →"

[sec.interns.title]
other = "Выдающиеся стажёры"
[sec.interns.lead]
other = "В списке не «несколько хороших стажёров», а конкретные люди. За каждой карточкой — смерженный коммит и результат, который признали в upstream."
[btn.allInterns]
other = "Полный список (с senior interns и их словами) →"
[sec.mentors.title]
other = "Наставники"
[sec.mentors.lead]
other = "Стажировка идёт за одним человеком: договор о стажировке возникает только после того, как наставник его признал. Этот раздел пополняется."
[btn.allMentors]
other = "Все наставники →"
[sec.shise.title]
other = "Проект «Пятицветный камень»"
[sec.shise.lead]
other = "Первого дня первого лунного месяца года Бин-у (2026) Проект Цзячэнь объявил программу подготовки глобальных лидеров RISC-V — сокращённо проект «Пятицветный камень»: по мотивам мифа о Нюйве, плавившей пятицветный камень, чтобы починить небо; цикл — десять лет, переход от «поиска и отбора людей» к «систематической и долгосрочной подготовке людей»."
[btn.shiseMore]
other = "«Пятицветный камень»: замысел и обоснование →"
[sec.projects.title]
other = "Открытые проекты"
[sec.projects.lead]
other = "На базе Проекта Цзячэнь организации-участники запустили ряд проектов; ниже — ещё одна подборка репозиториев, рекомендованных стажёрам для старта: это настоящие upstream-проекты, где можно получить настоящий review."
[projects.group1]
other = "Создано Проектом Цзячэнь вместе с участниками"
