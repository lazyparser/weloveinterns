  desc: '开源 EDA 工具及工具链开源 EDA 工具链对芯片的作用，正如 GCC/LLVM 之于开源软件生态。ECOS团队构建开源 EDA 工具链，覆盖仿真验证、逻辑综合、物理设计、物理验证等芯片设计核心步骤，支撑芯片全流程设计。如此，将来每一位同学和芯片爱好者，都可以使用开源软件设计自己的芯片，得到版图并且投片生产。这无疑是一个浩大的工程。仅在开源EDA一项工作上，ECOS就已经投放了数百人（从2018年开始），开发的代码量接近 50万行，并在2023年初步打通开源EDA工具流程，发布了 iEDA 项目。 未来很多年，ECOS都会从工程质量、算法性能、运行效率等方面，持续优化和提升开源EDA质量。欢迎对大型软件架构、对软件工程质量、程序运行效率感兴趣的同学加入。

