- id: E169
  title: 开源RISC-V高性能IP设计
  badge: 线下实习、应届工程线、研究线均有名额
  org: ECOS 团队
  track: ecos
  mode: 线下
  location: 北京 · 深圳（部分项目可选定；雄安筹建中）
  level: 未注明（应届工程线、研究线均有名额）
  stipend: 见 ECOS 团队说明
  slots: ''
  status: open
  desc: '“香山” 开源高性能 RISC-V 处理器代表了当前全球开源 RISC-V 处理器核的最高性能水平其最新流片版本 “昆明湖 V2” 在 SPECCPU2006 基准测试中可以达到 45分@3GHz（即 15分/GHz）的成绩。该性能水平已具备与目前业界主流 ARM 服务器芯片（如鲲鹏 920 及倚天 710）所采用的 ARM Neoverse N1/N2 级核心同台竞争的能力。

    目前，“香山” 团队正致力于研发面向数据中心的下一代高性能 RISC-V 处理器核心 “昆明湖 V3”。该版本旨在对标业界顶尖的数据中心处理器核 ARM Neoverse V2。“昆明湖 V3” 的设计目标为在 SPEC2006 性能基准测试中达到 22分/GHz 的性能水平，具备更高的性能水平与充足竞争力的能效表现，以进一步推动支持 RISC-V 架构在数据中心、高性能计算等领域的突破。

    “香山” 团队坚持全栈开源理念，其微架构文档、RTL 源代码及相关开发平台工具均已在 GitHub 完全公开。项目组构建了高度开放的开发团队与技术社区，无论您致力于高级体系结构、高性能算子实现、访存子系统优化、多核互联架构、向量扩展（RVV）还是处理器安全等领域，均可在 “香山” 找到喜欢与适合的方向。

    “香山” 处理器由香山团队主导设计，ECOS 团队深度参与技术研发与人才培养。

    本岗位由 ECOS 团队提供。相关实习要求、实习费、薪资等参考ECOS团队实习、应届校招、社招说明。

