- id: A180
  title: 嵌入式虚拟化 / Hypervisor 实习生
  org: 进程使命科技有限公司
  track: partner
  mode: 线下
  location: 上海（期望）· 北京
  level: 未注明（本科或研究生在读）
  stipend: 未注明
  slots: ''
  status: open
  desc: 本岗位来自进程使命科技有限公司。仅接受线下实习（上海）。进程使命更多的招聘信息可以从以下地址获得。
  duties:
  - 参与嵌入式 Hypervisor 核心功能的开发、调试与测试，包括 VM / vCPU、内存管理、中断及设备虚拟化等。
  - 参与 ARM64、RISC-V64 等架构适配，分析和解决特权级、异常、中断、地址转换等底层问题。
  - 针对虚拟化、RTOS、CPU 架构等技术方向开展 Research，阅读论文、技术规范、开源实现和社区资料，形成技术调研、方案设计与验证结论。
  - 使用 QEMU、GDB、Shell、Trace 等工具进行系统调试、实验验证和问题定位。
  - 参与开源社区协作，完成 Issue 分析、Patch 开发、代码评审等上游贡献。
  - 使用 AI Agent 辅助代码分析、技术调研、开发、调试和测试，并能够独立验证和改进 Agent 输出。
  reqs:
  - 计算机、软件、电子、自动化、通信等相关专业本科生或研究生。
  - 熟悉 C 语言，具备基本的 Linux 开发能力，能够使用 Git、Shell 等工具。
  - 了解操作系统基本概念，如线程、中断、虚拟内存、MMU 和异常处理等。
  - 具备一定的 Research 能力，能够主动检索和阅读英文技术资料、论文、架构手册及开源代码，并通过实验验证自己的分析和判断。
  - 具备较好的代码阅读、问题拆解和自主学习能力，对嵌入式系统、CPU 架构或虚拟化技术有兴趣。
  - 有 AI Agent / Coding Agent 实际使用经验，能够将 Agent 作为工程与 Research 工具，而非依赖“许愿式编程”。
  - 每周至少实习 3 天，实习周期不少于 3 个月。
  bonus:
  - 有 RTOS、Linux 内核、Bootloader、驱动或其他底层系统开发经验。
  - 了解 ARM64 / RISC-V 特权架构、页表、中断或硬件虚拟化机制。
  - 使用过 QEMU、GDB、Devicetree、Kconfig、CMake 或 Python。
  - 接触过 Hypervisor、KVM、Xen、IOMMU/SMMU 或设备虚拟化。
  - 有论文复现、技术调研、Benchmark / 实验设计或系统原型实现经验。
  - 有开源贡献或系统软件相关课程 / 个人项目经验。
  gains:
  - 参与真实嵌入式 Hypervisor 核心功能研发，而非外围 Demo。
  - 深入学习 RTOS、CPU 虚拟化、内存隔离、设备虚拟化和多架构系统开发。
  - 实践从 Research、方案设计、原型验证到工程实现的完整技术路径。
  - 探索 AI Agent 与系统软件研发、技术研究相结合的工作方式。
  - 参与真实开源社区协作，并将部分工作成果贡献至上游社区。
  links:
  - label: www.liepin.com
    url: https://www.liepin.com/company/21491191/
