  desc: 'ECOS Studio：集成整个ECOS团队的成果，形成一套IDE工具，全部使用开源EDA和开源IP设计芯片，全流程皆可开源并开放可见。每个人都可以基于该流程修改并实现自己的芯片设计方案，并无需支付昂贵的 EDA 和 IP 费用。每一个用 Verilog/Chisel/SpinalHDL/SystemVerilog 编写的数字模块，都可以用开源 EDA 和 SoC 来评估自己方案在 ASIC 流程上的 PPA，或者完成版图设计后，拿去流片。ECOS Studio 具备两种形式（本地IDE和云平台）。故而，认可开源芯片，同时对UI开发、web开发比较感兴趣的同学，是非常适合的。

