  slots: ''
  status: open
  desc: '“一生一芯”（ysyx.org）：是由中国科学院大学发起的大规模开放式公益性芯片及系统人才培养计划，专注培养学生独立分解和解决问题的能力，以及“计算机软硬件系统协同设计能力”和“芯片全链条设计能力”，全年开放报名，不限学校、专业和年级，皆可参与。自 2019 年发起以来，累计报名超 16000 人，覆盖国内外 1100 余所高校。往届学员入职华为海思、寒武纪、摩尔线程、海光、嘉楠科技等行业头部企业工作，或进入中科院、清华、北大、港科大、卡内基梅隆大学等国内外顶级院校深造。“一生一芯”新增全职助教的岗位，特别适合专注于技术精进、喜欢做社区、喜欢沟通交流的同学。全职助教的精力，一半用于提升技术实力、主导或参与自己感兴趣的开源技术项目，一半用于把ECOS团队的技术经验传递给更多学员（指导和组织分享等）。

