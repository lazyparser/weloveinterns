- date: 2017
  title: 機器人時代的資料庫
  desc: 一年 254 次提交，是儲存庫歷史的峰值。內容全是機器人、AI 與 ROS：MACE、GluonCV、opencv.js、YOLO-in-Android、TensorRT、PocketSphinx 語音辨識、深度學習模型壓縮。程式碼規範目錄叫 droid_coding_norm。
  kind: repo
  evidence: MACE/ · gluoncv_0.2/ · opencv.js/ · droid_coding_norm/

- date: 2018-2019
  title: 實習生的第一批評測
  desc: 儲存庫裡開始出現成篇的實習報告：Android 端整合語音合成、ROS Server 與 Android 端互動、ScanNet 資料、CNNdroid 部署。今天的「外部可見交付」制度，雛形就是這些報告。
  kind: repo
  evidence: Reports/ · reports/

- date: 2019
  title: PLCT 實驗室成立
  desc: 程式語言與編譯技術實驗室（PLCT）在中國科學院軟體研究所成立。儲存庫逐步變成 PLCT 的官方招募頁，plct-interns.md 出現。
  kind: org
  evidence: plct-interns.md

- date: 2019-03-14
  title: LV0–LV5 能力分級第一版公開
  desc: 借用常盤台中學的「能力者」設定，把實習生分成 LV0 到 LV5 六級，由主理人以「仁慈獨裁者」方式評定。
  kind: program
  evidence: how-do-we-rank-interns.md 檔案更新記錄

- date: 2020-06-01
  title: LV3 的准入門檻變成「會除錯」
  desc: 第三版更新把「能夠獨立分析遇到的 bug 或 crash」寫成 LV3 的硬門檻 —— 這是這套體系裡最不像學歷、最像能力的一條。
  kind: program
  evidence: how-do-we-rank-interns.md

- date: 2021-01-10
  title: wiki 退場，README 接手
  desc: reorganize 與 Remove Home.md 兩筆提交之後，儲存庫從 wiki 形態轉為單一 README 入口，一直沿用到今天。
  kind: repo
  evidence: 9bb3b23 · 066ef35

- date: 2022-03-27
  title: senior interns 分類公開
  desc: 設立理由的第一條就是「讓榮光落於刀鋒之上」。同時把「同輩指導、跨組互助」這些看不見的產出，納入評價體系。
  kind: program
  evidence: outstanding-interns.md

- date: 2022-09
  title: TARSIER 與它的第一批 LV4
  desc: 作業系統團隊 TARSIER 期間，王弈橋獨立建立並維護 openEuler RISC-V 衍生發行版 Eulaceura；陸言（Robin）完成開發板適配並有了以他命名的 RobinOS。
  kind: people
  evidence: outstanding-interns.md

- date: 2023-06
