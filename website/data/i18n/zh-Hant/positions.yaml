  desc: '「一生一芯」（ysyx.org）：是由中國科學院大學發起的大規模開放式公益性晶片及系統人才培育計畫，專注培育學生獨立分解和解決問題的能力，以及「電腦軟硬體系統協同設計能力」和「晶片全鏈條設計能力」，全年開放報名，不限學校、科系和年級，皆可參與。自 2019 年發起以來，累計報名超過 16000 人，覆蓋國內外 1100 餘所大專院校。歷屆學員入職華為海思、寒武紀、摩爾線程、海光、嘉楠科技等產業龍頭企業工作，或進入中科院、清華、北大、港科大、卡內基美隆大學等國內外頂尖院校深造。「一生一芯」新增全職助教的職缺，特別適合專注於技術精進、喜歡做社群、喜歡溝通交流的同學。全職助教的精力，一半用於提升技術實力、主導或參與自己感興趣的開源技術專案，一半用於把 ECOS 團隊的技術經驗傳遞給更多學員（指導和組織分享等）。

