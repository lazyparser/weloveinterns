  desc: '針對指定演算法和應用，分析其程式行為、效能瓶頸和架構特徵等，藉助軟體方法（平行運算、向量運算、記憶體存取最佳化等）、軟硬體協同設計和專用加速器設計等高效能運算方法，使用更少硬體資源達成更高程式效能。以高效能 RTL 模擬器為例，GSIM 支援 Chisel 語言，比 Verilator 還要快 10 倍，大幅提升了香山的測試和驗證效率。目前，ECOS 團隊在 EDA 軟體的效能最佳化、嵌入式系統的效能最佳化，以及未來在香山上的軟體最佳化上，都會投入大量時間和精力。

