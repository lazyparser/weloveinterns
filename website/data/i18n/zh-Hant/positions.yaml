- id: A180
  title: 嵌入式虛擬化 / Hypervisor 實習生
  org: 進程使命科技有限公司
  track: partner
  mode: 線下
  location: 上海（期望）· 北京
  level: 未註明（大學部或研究所學生在學）
  stipend: 未註明
  slots: ''
  status: open
  desc: 本職缺來自進程使命科技有限公司。僅接受線下實習（上海）。進程使命更多的招募資訊可以從以下網址取得。
  duties:
  - 參與嵌入式 Hypervisor 核心功能的開發、偵錯與測試，包括 VM / vCPU、記憶體管理、中斷及裝置虛擬化等。
  - 參與 ARM64、RISC-V64 等架構適配，分析並解決特權級、例外、中斷、位址轉換等底層問題。
  - 針對虛擬化、RTOS、CPU 架構等技術方向進行 Research，閱讀論文、技術規範、開源實作和社群資料，形成技術調研、方案設計與驗證結論。
  - 使用 QEMU、GDB、Shell、Trace 等工具進行系統偵錯、實驗驗證和問題定位。
  - 參與開源社群協作，完成 Issue 分析、Patch 開發、程式碼審查等上游貢獻。
  - 使用 AI Agent 輔助程式碼分析、技術調研、開發、偵錯和測試，並能夠獨立驗證和改進 Agent 輸出。
  reqs:
  - 資訊工程、軟體、電子、自動化、通訊等相關科系的大學部或研究所學生。
  - 熟悉 C 語言，具備基本的 Linux 開發能力，能夠使用 Git、Shell 等工具。
  - 了解作業系統基本概念，如執行緒、中斷、虛擬記憶體、MMU 和例外處理等。
  - 具備一定的 Research 能力，能夠主動檢索和閱讀英文技術資料、論文、架構手冊及開源程式碼，並透過實驗驗證自己的分析和判斷。
  - 具備較好的程式碼閱讀、問題拆解和自主學習能力，對嵌入式系統、CPU 架構或虛擬化技術有興趣。
  - 有 AI Agent / Coding Agent 實際使用經驗，能夠將 Agent 作為工程與 Research 工具，而非依賴「許願式程式設計」。
  - 每週至少實習 3 天，實習期間不少於 3 個月。
  bonus:
  - 有 RTOS、Linux 核心、Bootloader、驅動程式或其他底層系統開發經驗。
  - 了解 ARM64 / RISC-V 特權架構、頁表、中斷或硬體虛擬化機制。
  - 使用過 QEMU、GDB、Devicetree、Kconfig、CMake 或 Python。
  - 接觸過 Hypervisor、KVM、Xen、IOMMU/SMMU 或裝置虛擬化。
  - 有論文重現、技術調研、Benchmark / 實驗設計或系統原型實作經驗。
  - 有開源貢獻或系統軟體相關課程 / 個人專案經驗。
  gains:
  - 參與真實嵌入式 Hypervisor 核心功能研發，而非周邊 Demo。
  - 深入學習 RTOS、CPU 虛擬化、記憶體隔離、裝置虛擬化和多架構系統開發。
  - 實踐從 Research、方案設計、原型驗證到工程實作的完整技術路徑。
  - 探索 AI Agent 與系統軟體研發、技術研究結合的工作方式。
  - 參與真實開源社群協作，並將部分工作成果貢獻至上游社群。
  links:
  - label: www.liepin.com
    url: https://www.liepin.com/company/21491191/
