- id: K183
  title: RT-Thread 嵌入式開發
  org: 甲辰計畫 · 五色石工程
  track: jiachen
  mode: 遠端
  location: 線上遠端
  level: LV1 及以上
  stipend: 無實習津貼（提供 RISC-V 開發板與 Token）
  slots: ''
  status: open
  desc: '注意：本職缺 沒有 實習津貼，會提供實習所需的 RISC-V 開發板（由甲辰計畫開發板漂流或廠商直接捐贈）以及 Token。面試合格後提供實習合約和實習證明。實習簽署單位為上海苦芽科技有限公司。

    實習生在 mentor 的指導下，向 RT-Thread 開源社群直接貢獻程式碼，所有成果公開可查。完成初級的實習成果後，可以推薦更多用人單位的實習職缺或校園徵才職缺。

    本職缺由甲辰計畫主理人吳偉（lazyparser）發起，負責面試和培育工作，並有多名 RT-Thread 開發者／講師擔任 mentor。本職缺屬於五色石工程的一部分。'
  duties:
  - 基於 RT-Thread 系統製作一些嵌入式應用案例，包括但不限於各類機器人的控制模組等。
  - 補齊並長期維護 RT-Thread 儲存庫中多種 RISC-V SoC 的支援，依社群維護者的長期路線培育
  - （可選）撰寫一些技術部落格，介紹和推廣 RT-Thread 的應用案例。
  - （可選）製作一些影片宣傳推廣 RT-Thread，包含在英語世界、東南亞地區等。
  - （可選）鼓勵參與技術分享公開演講等，介紹自己的實習工作。
  reqs:
  - 對嵌入式開發和硬體整合有熱情，積極主動，善於主動溝通，能夠明確知道自己想透過實習獲得什麼。
  - 熟練使用 AI 大模型和各種 Harness 幫助自己完成日常工作流程。
  - 具備 LV1 及以上技術能力。
  - 能夠穩定實習 3 個月以上（線上遠端，每週有進展即可）。
