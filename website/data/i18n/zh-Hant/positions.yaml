  desc: '開源 EDA 工具及工具鏈開源 EDA 工具鏈對晶片的作用，正如 GCC/LLVM 之於開源軟體生態。ECOS 團隊建構開源 EDA 工具鏈，覆蓋模擬驗證、邏輯綜合、實體設計、實體驗證等晶片設計核心步驟，支撐晶片全流程設計。如此，將來每一位同學和晶片愛好者，都可以使用開源軟體設計自己的晶片，得到佈局圖並且投片生產。這無疑是一個浩大的工程。僅在開源 EDA 一項工作上，ECOS 就已經投放了數百人（從 2018 年開始），開發的程式碼量接近 50 萬行，並在 2023 年初步打通開源 EDA 工具流程，發布了 iEDA 專案。未來很多年，ECOS 都會從工程品質、演算法效能、執行效率等方面，持續最佳化和提升開源 EDA 品質。歡迎對大型軟體架構、對軟體工程品質、程式執行效率感興趣的同學加入。

