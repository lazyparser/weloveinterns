- id: E169
  title: 開源 RISC-V 高效能 IP 設計
  badge: 線下實習、應屆工程職系、研究職系均有名額
  org: ECOS 團隊
  track: ecos
  mode: 線下
  location: 北京 · 深圳（部分專案可選定；雄安籌建中）
  level: 未註明（應屆工程職系、研究職系均有名額）
  stipend: 見 ECOS 團隊說明
  slots: ''
  status: open
  desc: '「香山」開源高效能 RISC-V 處理器代表了當前全球開源 RISC-V 處理器核的最高效能水準其最新流片版本「昆明湖 V2」在 SPECCPU2006 基準測試中可以達到 45 分@3GHz（即 15 分/GHz）的成績。該效能水準已具備與目前業界主流 ARM 伺服器晶片（如鯤鵬 920 及倚天 710）所採用的 ARM Neoverse N1/N2 級核心同台競爭的能力。

    目前，「香山」團隊正致力於研發面向資料中心的下一代高效能 RISC-V 處理器核心「昆明湖 V3」。該版本旨在對標業界頂尖的資料中心處理器核 ARM Neoverse V2。「昆明湖 V3」的設計目標為在 SPEC2006 效能基準測試中達到 22 分/GHz 的效能水準，具備更高的效能水準與充足競爭力的能效表現，以進一步推動支援 RISC-V 架構在資料中心、高效能運算等領域的突破。

    「香山」團隊堅持全端開源理念，其微架構文件、RTL 原始碼及相關開發平台工具均已在 GitHub 完全公開。專案組建構了高度開放的開發團隊與技術社群，無論您致力於高階電腦架構、高效能運算子實作、記憶體存取子系統最佳化、多核互連架構、向量擴充（RVV）還是處理器安全等領域，均可在「香山」找到喜歡與適合的方向。

    「香山」處理器由香山團隊主導設計，ECOS 團隊深度參與技術研發與人才培育。

    本職缺由 ECOS 團隊提供。相關實習要求、實習津貼、薪資等參考 ECOS 團隊實習、應屆校園徵才、社會招募說明。

    本職缺需要線下實習，可選擇入職到中國科學院計算技術研究所（所編、專案聘、創嘉），或者是北京開源晶片研究院辦公地點，除少數專案有傾向性外，大部分可選擇北京、深圳。同時，正在增設雄安（生活成本低且環境好）。'
