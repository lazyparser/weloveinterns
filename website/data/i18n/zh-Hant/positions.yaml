- id: B179
  title: 虛擬化與即時作業系統開發實習生
  badge: 開放 2 名
  org: 成員單位（儲存庫未註明提供方）
  track: partner
  mode: 未註明
  location: 未註明
  level: LV3 及以上
  stipend: 未註明
  slots: 2 名
  status: open
  desc: 面向國產 ARM SoC 平台，進行虛擬化與即時作業系統的移植、適配與即時性調校。你會同時接觸 Hypervisor、RTOS 核心、Linux 驅動程式三層。
  duties:
  - 'Bao Hypervisor 平台適配: 在 Renesas、NXP、Rockchip MCU 上完成 Bootstrap、中斷控制器、記憶體與 Cache 分割、裝置直通與 VirtIO 後端，開發並使用平台 BSP/MCAL。'
  - RTOS 核心移植：啟用 MMU 與使用者態行程模型，建立行程間位址空間隔離。
  - ARM 平台驅動程式開發：Linux 與 RTOS 兩側的驅動適配，以及跨核通訊通道（Mailbox / 共享記憶體）的設計與實作。
  - AMP 與虛擬化混合部署：A 核側執行 Hypervisor 承載 Linux 與 RTOS 並存，R 核側承載硬即時任務；負責兩域的資源隔離（含 Cache / NPU 分割）與開機流程。
  - 即時性量測與調校：情境切換、中斷回應、控制週期抖動的微秒級量測，建立可重現的測試方法並輸出資料。
  - Rust 在 RTOS 中的落地：讓 RTOS 具備執行 Rust 應用程式與中介軟體的能力（std 函式庫、非同步機制），並逐步將核心模組遷移到 Rust（Good To Have）。
  - 靜態程式碼分析與認證相關的編碼規範（Good To Have）。
  reqs:
  - LV3 及以上，對底層電腦程式設計有濃厚興趣；
  - 熟練 C 與組合語言；
  - 熟悉 Linux 核心與驅動程式開發，有 ARM 平台 Linux 驅動程式開發經驗者優先；
  - 了解至少一種 RTOS（RT-Thread / FreeRTOS / Zephyr 等），理解 POSIX 介面模型；
  - 具備作業系統、排程與即時系統的知識，理解即時性指標的定義與量測方法；
  - 紮實的電腦架構與處理器知識：ARMv8-A / ARMv8-R、例外等級、MMU / MPU、GIC、Cache 一致性；
  - 熟練使用 Git、SSH、Bash Script 等不同小工具提升效率；
  - 基本了解硬體偵錯介面、硬體偵錯器（JTAG / 序列埠 / 邏輯分析儀 / 示波器）；
  - 電腦工程、電機工程或資訊工程的學士、碩士學位。
  bonus:
  - Rust，尤其是嵌入式或 no_std 方向；
  - 接觸過任一虛擬化方案（Bao / Jailhouse / Xen / KVM）；
  - 異質多核 AMP 架構、核間通訊的實務經驗；
  - 功能安全或自主可控認證相關的開發流程經驗；
  - 靜態分析工具使用經驗（MISRA C、Coverity、clang-analyzer 等）；
  - 開源社群貢獻紀錄。
  gains:
  - 真實量產專案上的晶片平台適配、Hypervisor 與 RTOS 的完整移植鏈路，以及 Rust 在安全關鍵系統中的工程化落地 —— 這些工作會直接進入客戶的 Safety Critical 產品，不是練習專案。
