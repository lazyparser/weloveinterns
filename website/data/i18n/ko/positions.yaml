- id: E168
  title: 오픈소스 EDA 도구/툴체인 개발
  badge: 현장 인턴십, 신입 엔지니어링 트랙, 연구 트랙 모두 정원 있음
  org: ECOS 팀
  track: ecos
  mode: 현장
  location: 베이징 · 선전(일부 프로젝트는 선택 가능, 슝안 준비 중)
  level: 미기재(신입 엔지니어링 트랙, 연구 트랙 모두 정원 있음)
  stipend: ECOS 팀 안내 참조
  slots: ''
  status: open
  desc: '오픈소스 EDA 도구와 툴체인이 칩에 하는 역할은 GCC/LLVM이 오픈소스 소프트웨어 생태계에 하는 역할과 같습니다. ECOS 팀은 시뮬레이션 검증, 논리 합성, 물리 설계, 물리 검증 등 칩 설계의 핵심 단계를 아우르는 오픈소스 EDA 툴체인을 구축해 칩 전 과정 설계를 뒷받침합니다. 이렇게 되면 앞으로 모든 학생과 칩 애호가가 오픈소스 소프트웨어로 자신의 칩을 설계하고 레이아웃을 얻어 테이프아웃까지 할 수 있습니다. 이는 분명 방대한 작업입니다. 오픈소스 EDA 한 가지 일에만 ECOS는 이미 수백 명을 투입했고(2018년부터), 개발한 코드량은 50만 줄에 가깝습니다. 2023년에는 오픈소스 EDA 도구 흐름을 처음으로 이어 붙이고 iEDA 프로젝트를 발표했습니다. 앞으로도 여러 해 동안 ECOS는 엔지니어링 품질, 알고리즘 성능, 실행 효율 등에서 오픈소스 EDA 품질을 계속 최적화하고 높일 것입니다. 대형 소프트웨어 아키텍처, 소프트웨어 엔지니어링 품질, 프로그램 실행 효율에 관심 있는 학생의 참여를 환영합니다.


    이 포지션은 ECOS 팀이 제공합니다. 관련 인턴 요건, 인턴 수당, 급여 등은 ECOS 팀 인턴·신입 공채·경력 채용 안내를 참고하십시오.


    이 포지션은 현장 인턴십이 필요하며, 중국과학원 계산기술연구소(소속 정원, 프로젝트 채용, 创嘉)나 베이징 오픈소스 칩 연구원 근무지로 입사할 수 있습니다. 일부 프로젝트의 선호를 제외하면 대부분 베이징이나 선전을 선택할 수 있습니다. 현재 슝안(생활비가 낮고 환경이 좋습니다)에도 사무소를 추가로 열고 있습니다.'
