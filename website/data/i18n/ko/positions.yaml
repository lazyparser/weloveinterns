- id: E174
  title: RISC-V 오픈소스 임베디드 시스템 설계 및 개발
  badge: 현장 인턴십, 신입 엔지니어링 트랙, 연구 트랙 모두 정원 있음
  org: ECOS 팀
  track: ecos
  mode: 현장
  location: 베이징 · 선전(일부 프로젝트는 선택 가능, 슝안 준비 중)
  level: 미기재(신입 엔지니어링 트랙, 연구 트랙 모두 정원 있음)
  stipend: ECOS 팀 안내 참조
  slots: ''
  status: open
  desc: 'ECOS 팀이 직접 개발하거나 시장 주류인 RISC-V 아키텍처 프로세서 칩을 대상으로 PCB 보드, 임베디드 SDK, 임베디드 개발 도구, 대표 응용 사례를 설계하고, 이에 맞는 칩 매뉴얼과 보드 사용 문서를 작성합니다. ECOS 팀이 내놓는 칩은 대부분 오픈소스 프로세서 코어와 오픈소스 EDA를 기반으로 SoC 통합, 물리 설계, 테이프아웃, 패키징, 보드 설계 등의 단계를 자체적으로 완료합니다. 임베디드 팀은 칩 팀과 긴밀히 협업하며, 칩 규격 정의, SoC 통합과 검증 등의 업무에도 참여할 수 있습니다. ECOS에 합류해 임베디드 시스템 업무를 하면 소프트웨어와 하드웨어를 모두 아는 풀스택 고수준 임베디드 엔지니어로 성장할 수 있습니다. 임베디드 팀에는 로봇, 임베디드 게임, 휴대용 게임기, 스마트 장난감 등 여러 응용을 탐구하고 재미있는 것을 시도할 여지가 큽니다.


    이 포지션은 ECOS 팀이 제공합니다. 관련 인턴 요건, 인턴 수당, 급여 등은 ECOS 팀 인턴·신입 공채·경력 채용 안내를 참고하십시오.


    이 포지션은 현장 인턴십이 필요하며, 중국과학원 계산기술연구소(소속 정원, 프로젝트 채용, 创嘉)나 베이징 오픈소스 칩 연구원 근무지로 입사할 수 있습니다. 일부 프로젝트의 선호를 제외하면 대부분 베이징이나 선전을 선택할 수 있습니다. 현재 슝안(생활비가 낮고 환경이 좋습니다)에도 사무소를 추가로 열고 있습니다.'
  links:
  - label: mp.weixin.qq.com
    url: https://mp.weixin.qq.com/s/_UUNePIXV5H1q742XKVfnw
