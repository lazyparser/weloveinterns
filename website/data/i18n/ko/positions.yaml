  stipend: ECOS 팀 안내 참조
  slots: ''
  status: open
  desc: '중저가형 RISC-V 오픈소스 프로세서 코어 IP를 개발하며, 저전력과 임베디드 시스템 설계 등을 중시합니다. 여기서 ECOS 팀이 프로세서 코어를 개발할 때는 PPA 품질을 강조하고, 프로세서 코어의 커스터마이징 가능성을 높이는 데 힘쓰며, 가속 부품과 사용자 정의 확장 명령을 유연하게 통합하는 것을 지원합니다. 동시에 RISC-V의 주요 응용 분야를 겨냥해 AMBA, SDRAM, VGA, UART, I2C, PWM, QSPI, 임베디드 그래픽 GPU, Bluetooth, Ethernet 등 주변 IP와 필요한 계산 IP를 개발합니다.


    이 포지션은 ECOS 팀이 제공합니다. 관련 인턴 요건, 인턴 수당, 급여 등은 ECOS 팀 인턴·신입 공채·경력 채용 안내를 참고하십시오.


    이 포지션은 현장 인턴십이 필요하며, 중국과학원 계산기술연구소(소속 정원, 프로젝트 채용, 创嘉)나 베이징 오픈소스 칩 연구원 근무지로 입사할 수 있습니다. 일부 프로젝트의 선호를 제외하면 대부분 베이징이나 선전을 선택할 수 있습니다. 현재 슝안(생활비가 낮고 환경이 좋습니다)에도 사무소를 추가로 열고 있습니다.'
