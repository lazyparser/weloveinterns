  slots: ''
  status: open
  desc: 'ECOS Studio: ECOS 팀 전체의 성과를 통합해 하나의 IDE 도구로 만든 것으로, 모두 오픈소스 EDA와 오픈소스 IP로 칩을 설계하며 전 과정을 오픈소스로 공개하고 확인할 수 있습니다. 누구나 이 흐름을 기반으로 자신의 칩 설계안을 수정하고 구현할 수 있으며, 비싼 EDA와 IP 비용을 지불할 필요가 없습니다. Verilog/Chisel/SpinalHDL/SystemVerilog로 작성한 모든 디지털 모듈은 오픈소스 EDA와 SoC로 자신의 설계안이 ASIC 흐름에서 갖는 PPA를 평가하거나, 레이아웃 설계를 마친 뒤 테이프아웃에 보낼 수 있습니다. ECOS Studio는 두 가지 형태(로컬 IDE와 클라우드 플랫폼)를 갖추고 있습니다. 그래서 오픈소스 칩을 인정하면서 UI 개발과 웹 개발에도 관심이 많은 학생에게 아주 적합합니다.


