- id: B179
  title: 가상화 및 실시간 운영체제 개발 인턴
  badge: 2명 모집
  org: 멤버 기관(저장소에 제공자 미기재)
  track: partner
  mode: 미기재
  location: 미기재
  level: LV3 이상
  stipend: 미기재
  slots: 2명
  status: open
  desc: 국산 ARM SoC 플랫폼을 대상으로 가상화와 실시간 운영체제의 이식, 적응, 실시간성 튜닝을 합니다. Hypervisor, RTOS 커널, Linux 드라이버 세 계층을 동시에 다루게 됩니다.
  duties:
  - 'Bao Hypervisor 플랫폼 적응: Renesas, NXP, Rockchip MCU에서 Bootstrap, 인터럽트 컨트롤러, 메모리와 Cache 파티셔닝, 디바이스 패스스루와 VirtIO 백엔드를 완성하고, 플랫폼 BSP/MCAL을 개발하고 사용합니다.'
  - 'RTOS 커널 이식: MMU와 사용자 공간 프로세스 모델을 활성화하고, 프로세스 간 주소 공간 격리를 구축합니다.'
  - 'ARM 플랫폼 드라이버 개발: Linux와 RTOS 양쪽의 드라이버 적응, 그리고 코어 간 통신 채널(Mailbox / 공유 메모리)의 설계와 구현.'
  - 'AMP와 가상화 혼합 배치: A 코어 쪽에서 Hypervisor를 돌려 Linux와 RTOS를 함께 구동하고, R 코어 쪽에서 하드 실시간 작업을 담당합니다. 두 도메인의 자원 격리(Cache / NPU 파티셔닝 포함)와 부팅 흐름을 맡습니다.'
  - '실시간성 측정과 튜닝: 컨텍스트 스위치, 인터럽트 응답, 제어 주기 지터를 마이크로초 단위로 측정하고, 재현 가능한 테스트 방법을 세워 데이터를 산출합니다.'
  - 'RTOS에서 Rust 적용: RTOS가 Rust 응용과 미들웨어(std 라이브러리, 비동기 메커니즘)를 실행할 수 있게 하고, 커널 모듈을 점차 Rust로 이전합니다(Good To Have).'
  - 정적 코드 분석과 인증 관련 코딩 규범(Good To Have).
  reqs:
  - LV3 이상이며, 저수준 컴퓨터 프로그래밍에 깊은 관심이 있어야 합니다.
  - C와 어셈블리 언어에 능숙해야 합니다.
  - Linux 커널과 드라이버 개발에 익숙해야 하며, ARM 플랫폼 Linux 드라이버 개발 경험자가 우대됩니다.
  - 최소 한 가지 RTOS(RT-Thread / FreeRTOS / Zephyr 등)를 알고, POSIX 인터페이스 모델을 이해해야 합니다.
  - 운영체제, 스케줄링, 실시간 시스템 지식을 갖추고 실시간성 지표의 정의와 측정 방법을 이해해야 합니다.
  - '탄탄한 컴퓨터 아키텍처와 프로세서 지식: ARMv8-A / ARMv8-R, 예외 등급, MMU / MPU, GIC, Cache 일관성.'
  - Git, SSH, Bash Script 등 여러 도구를 능숙하게 사용해 효율을 높일 수 있어야 합니다.
  - 하드웨어 디버깅 인터페이스와 하드웨어 디버거(JTAG / 시리얼 포트 / 로직 분석기 / 오실로스코프)를 기본적으로 알고 있어야 합니다.
  - 컴퓨터공학, 전기공학 또는 컴퓨터과학의 학사·석사 학위.
  bonus:
  - Rust, 특히 임베디드나 no_std 방향.
  - Bao / Jailhouse / Xen / KVM 중 어느 하나의 가상화 방식을 접해 본 경험.
  - 이기종 다중 코어 AMP 아키텍처, 코어 간 통신 실무 경험.
  - 기능 안전이나 자주적 통제 인증과 관련된 개발 프로세스 경험.
  - 정적 분석 도구 사용 경험(MISRA C, Coverity, clang-analyzer 등).
  - 오픈소스 커뮤니티 기여 이력.
  gains:
  - 실제 양산 프로젝트의 칩 플랫폼 적응, Hypervisor와 RTOS의 완전한 이식 경로, 그리고 Rust를 안전 필수 시스템에 엔지니어링으로 적용하는 일 — 이 작업들은 고객의 Safety Critical 제품에 바로 들어가며, 연습 프로젝트가 아닙니다.
- id: H178
  title: 임바디드 AI 하드웨어 개발 인턴(정교한 로봇손 방향)
  org: 허페이공업대학 수학대학 RISC-V 생태계 연구실(설립 준비 중)
  track: hfut
  mode: 현장
  location: 허페이 · 공업대학 페이추이후 캠퍼스 과학교육관 B동 1609
  level: LV3
  stipend: 보장 인턴 수당 없음(외부에서 확인 가능한 산출물에 따라 멘토와 협의)
  slots: 2명
  status: open
  duties:
  - 이 포지션은 허페이공업대학 수학대학 RISC-V 생태계 연구실(설립 준비 중) 겸 지아천 프로젝트 허페이 RISC-V 표류 기지가 제공하는 인턴 포지션입니다. 인턴 업무는 촉각과 근전도를 갖춘 두 손가락 그리퍼, 세 손가락 그리퍼, 다섯 손가락 정교한 로봇손과 가능한 여러 형태의 특수 엔드이펙터를 연구·제작하고, 프로젝트 요구에 맞춰 관련 임베디드 소프트웨어를 개발하는 것입니다. 관심이 있으면 일부 AI 알고리즘/모델의 테스트와 개발에도 참여할 수 있습니다.
  - 현장에서 하드웨어를 다뤄야 하므로 허페이공업대학 페이추이후 캠퍼스와 주변 대학의 학부생을 우선 모집합니다. 허페이공업대학 수학대학 RISC-V 생태계 연구실(설립 준비 중)이 인턴십에 필요한 각종 RISC-V 칩과 실험용 로봇팔, 센서 등을 제공합니다.
  - '인턴 근무지: 허페이공업대학 페이추이후 캠퍼스 과학교육관 B동 1609호(RISC-V 생태계 연구실)'
  - '인턴 수당: 보장 인턴 수당은 없으며, 외부에서 확인 가능한 산출물에 따라 멘토와 협의합니다(위 주의 사항 참조). 지아천 프로젝트 포지션은 출근 시간으로 급여를 계산하지 않는다는 점에 유의하십시오.'
  reqs:
  - 자기 평가 기준 최소 LV3 능력 레벨에 도달해야 하며, 손으로 직접 하는 작업 능력이 좋아야 합니다.
  - 구조와 임베디드, 자동화에 대한 지식이나 경험이 있어야 합니다(인두, 멀티미터 등을 능숙하게 쓰면 가산점).
  - 임바디드 AI 방향과 AI 알고리즘에 깊은 관심이 있고, 직접 실행해 본 적이 있어야 합니다.
  - 각종 전자 부품이나 소프트웨어 시스템을 만지고 뜯어보는 것을 좋아해야 합니다.
  - 공개 기술 발표와 오프라인 활동 공유를 즐겨야 합니다.
  - 매주 평일 중 최소 2일은 RISC-V 생태계 연구실에 올 수 있어야 합니다(하드웨어를 다뤄야 하기 때문입니다).
