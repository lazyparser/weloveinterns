- id: E169
  title: 오픈소스 RISC-V 고성능 IP 설계
  badge: 현장 인턴십, 신입 엔지니어링 트랙, 연구 트랙 모두 정원 있음
  org: ECOS 팀
  track: ecos
  mode: 현장
  location: 베이징 · 선전(일부 프로젝트는 선택 가능, 슝안 준비 중)
  level: 미기재(신입 엔지니어링 트랙, 연구 트랙 모두 정원 있음)
  stipend: ECOS 팀 안내 참조
  slots: ''
  status: open
  desc: '‘샹산’ 오픈소스 고성능 RISC-V 프로세서는 현재 전 세계 오픈소스 RISC-V 프로세서 코어 가운데 최고 성능 수준을 대표합니다. 최신 테이프아웃 버전인 ‘쿤밍후 V2’는 SPECCPU2006 벤치마크에서 45점@3GHz(즉 15점/GHz)를 달성합니다. 이 성능 수준은 현재 업계 주류 ARM 서버 칩(예: 鲲鹏 920, 倚天 710)이 쓰는 ARM Neoverse N1/N2급 코어와 같은 무대에서 겨룰 수 있는 능력을 갖추었습니다.


    현재 ‘샹산’ 팀은 데이터센터를 겨냥한 차세대 고성능 RISC-V 프로세서 코어 ‘쿤밍후 V3’ 개발에 매진하고 있습니다. 이 버전은 업계 최정상 데이터센터 프로세서 코어인 ARM Neoverse V2를 목표로 합니다. ‘쿤밍후 V3’의 설계 목표는 SPEC2006 성능 벤치마크에서 22점/GHz의 성능 수준에 도달하는 것이며, 더 높은 성능과 충분한 경쟁력을 갖춘 에너지 효율을 갖춰 RISC-V 아키텍처가 데이터센터, 고성능 컴퓨팅 등 분야에서 돌파구를 여는 것을 더욱 뒷받침하려는 것입니다.


    ‘샹산’ 팀은 풀스택 오픈소스 이념을 고수하며, 마이크로아키텍처 문서, RTL 소스 코드, 관련 개발 플랫폼 도구를 모두 GitHub에 완전히 공개했습니다. 프로젝트 팀은 매우 개방적인 개발 팀과 기술 커뮤니티를 구축했으며, 고급 시스템 아키텍처, 고성능 연산자 구현, 메모리 접근 서브시스템 최적화, 다중 코어 상호 연결 아키텍처, 벡터 확장(RVV), 프로세서 보안 등 어느 분야에 뜻을 두든 ‘샹산’에서 좋아하고 맞는 방향을 찾을 수 있습니다.


    ‘샹산’ 프로세서는 샹산 팀이 주도해 설계하고, ECOS 팀이 기술 연구개발과 인재 양성에 깊이 참여합니다.


    이 포지션은 ECOS 팀이 제공합니다. 관련 인턴 요건, 인턴 수당, 급여 등은 ECOS 팀 인턴·신입 공채·경력 채용 안내를 참고하십시오.


    이 포지션은 현장 인턴십이 필요하며, 중국과학원 계산기술연구소(소속 정원, 프로젝트 채용, 创嘉)나 베이징 오픈소스 칩 연구원 근무지로 입사할 수 있습니다. 일부 프로젝트의 선호를 제외하면 대부분 베이징이나 선전을 선택할 수 있습니다. 현재 슝안(생활비가 낮고 환경이 좋습니다)에도 사무소를 추가로 열고 있습니다.'
