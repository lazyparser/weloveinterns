- id: K183
  title: RT-Thread 임베디드 개발
  org: 지아천 프로젝트 · 오색석 프로젝트
  track: jiachen
  mode: 원격
  location: 온라인 원격
  level: LV1 이상
  stipend: 인턴 수당 없음(RISC-V 개발보드와 Token 제공)
  slots: ''
  status: open
  desc: '주의: 이 포지션에는 인턴 수당이 없습니다. 대신 인턴십에 필요한 RISC-V 개발보드(지아천 프로젝트 개발보드 표류 또는 제조사 직접 기증)와 Token을 제공합니다. 면접에 합격하면 인턴 계약서와 인턴 증명서를 발급합니다. 계약 주체는 상하이 Kubuds(苦芽科技) 유한공사입니다.


    인턴은 멘토의 지도 아래 RT-Thread 오픈소스 커뮤니티에 직접 코드를 기여하며, 모든 성과는 공개되어 확인할 수 있습니다. 초급 인턴 성과를 마치면 더 많은 고용 기관의 인턴 포지션이나 신입 채용 포지션을 추천받을 수 있습니다.


    이 포지션은 지아천 프로젝트를 이끄는 吴伟(lazyparser)가 발의했고 면접과 양성을 맡으며, 여러 RT-Thread 개발자·강사가 멘토로 참여합니다. 이 포지션은 오색석 프로젝트의 일부입니다.'
  duties:
  - RT-Thread 시스템 기반의 임베디드 응용 사례를 만듭니다. 각종 로봇의 제어 모듈 등을 포함하며 이에 한정되지 않습니다.
  - RT-Thread 저장소에서 여러 RISC-V SoC 지원을 보완하고 장기적으로 유지보수하며, 커뮤니티 메인테이너의 장기 로드맵에 따라 양성합니다.
  - (선택) RT-Thread 응용 사례를 소개하고 알리는 기술 블로그를 작성합니다.
  - (선택) RT-Thread를 알리는 영상을 제작합니다. 영어권, 동남아 지역 등을 포함합니다.
  - (선택) 기술 공유와 공개 발표 등에 참여해 자신의 인턴 업무를 소개하는 것을 권장합니다.
  reqs:
  - 임베디드 개발과 하드웨어 통합에 열정이 있고, 주도적이며 먼저 소통하는 데 능하고, 인턴십을 통해 무엇을 얻고 싶은지 분명히 알고 있어야 합니다.
  - AI 대규모 모델과 각종 Harness를 능숙하게 사용해 일상 업무 흐름을 처리할 수 있어야 합니다.
  - LV1 이상의 기술 능력을 갖추어야 합니다.
  - 3개월 이상 안정적으로 인턴십을 할 수 있어야 합니다(온라인 원격, 매주 진전이 있으면 됩니다).
