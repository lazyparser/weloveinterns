- id: E171
  title: ‘一生一芯’ 인재 양성 계획 전임 조교
  badge: 현장 인턴십, 신입 엔지니어링 트랙, 연구 트랙 모두 정원 있음
  org: ECOS 팀
  track: ecos
  mode: 현장
  location: 베이징 · 선전(일부 프로젝트는 선택 가능, 슝안 준비 중)
  level: 미기재(신입 엔지니어링 트랙, 연구 트랙 모두 정원 있음)
  stipend: ECOS 팀 안내 참조
  slots: ''
  status: open
  desc: '‘一生一芯’(ysyx.org)는 중국과학원대학이 발의한 대규모 개방형 공익 칩·시스템 인재 양성 계획으로, 학생이 스스로 문제를 분해하고 해결하는 능력, 그리고 ‘컴퓨터 소프트웨어·하드웨어 시스템 공동 설계 능력’과 ‘칩 전 과정 설계 능력’을 기르는 데 집중합니다. 연중 지원을 받으며 학교, 전공, 학년을 가리지 않고 누구나 참여할 수 있습니다. 2019년 발의 이후 누적 지원자가 16000명을 넘고 국내외 1100여 개 대학을 아우릅니다. 지난 기수 수강생들은 华为海思, 寒武纪, 摩尔线程, 海光, 嘉楠科技 등 업계 선도 기업에 취업하거나, 중국과학원, 칭화대, 베이징대, 홍콩과기대, 카네기멜런대 등 국내외 최상위 대학에서 계속 공부했습니다. ‘一生一芯’이 새로 낸 전임 조교 포지션은 기술 연마에 집중하고 커뮤니티를 좋아하며 소통을 즐기는 학생에게 특히 적합합니다. 전임 조교의 에너지는 절반을 기술 역량을 높이고 관심 있는 오픈소스 기술 프로젝트를 주도하거나 참여하는 데, 나머지 절반을 ECOS 팀의 기술 경험을 더 많은 수강생에게 전하는 데(지도와 공유 기획 등) 씁니다.


    이 포지션은 ECOS 팀이 제공합니다. 관련 인턴 요건, 인턴 수당, 급여 등은 ECOS 팀 인턴·신입 공채·경력 채용 안내를 참고하십시오.


