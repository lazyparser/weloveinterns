# 채용 중인 포지션: 데이터 원본은 저장소 루트 open-internships.md의 「열린 포지션 목록」 절입니다.
# 포지션을 바꿀 때는 먼저 저장소의 그 md를 고치고 여기에 동기화합니다; status는 open(채용 중) / tba(상세 보충 예정) / full(마감)입니다.
tracks:
- key: jiachen
  name: 지아천 프로젝트
  note: 지아천 프로젝트를 이끄는 吴伟(lazyparser)가 발의했고 면접과 양성을 맡습니다. 인턴 계약 주체는 상하이 Kubuds(苦芽科技) 유한공사이며, 오색석 프로젝트의 일부입니다.
- key: hfut
  name: 허페이공업대학 RISC-V 생태계 연구실(설립 준비 중)
  note: 지아천 프로젝트의 허페이 RISC-V 표류 기지로, 인턴십에 필요한 RISC-V 칩과 로봇팔, 센서를 제공합니다. 하드웨어를 직접 다뤄야 하므로 허페이 현지 대학의 학부생을 우선 모집합니다.
- key: ecos
  name: ECOS 팀
  note: 현장 인턴십이며, 중국과학원 계산기술연구소(소속 정원, 프로젝트 채용, 创嘉)나 베이징 오픈소스 칩 연구원에 입사할 수 있습니다. 대부분의 포지션은 베이징이나 선전을 선택할 수 있고, 슝안 사무소는 준비 중입니다.
- key: partner
  name: 멤버 기관과 협력 기업
  note: 지아천 프로젝트 멤버나 협력 기업이 직접 제공하며, 면접과 고용은 해당 기관이 맡습니다.
