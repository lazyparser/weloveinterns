- id: A180
  title: 임베디드 가상화 / Hypervisor 인턴
  org: 进程使命科技有限公司
  track: partner
  mode: 현장
  location: 상하이(희망) · 베이징
  level: 미기재(학부 또는 대학원 재학)
  stipend: 미기재
  slots: ''
  status: open
  desc: 이 포지션은 进程使命科技有限公司에서 제공합니다. 현장 인턴십만 받습니다(상하이). 进程使命의 다른 채용 정보는 아래 주소에서 확인할 수 있습니다.
  duties:
  - 임베디드 Hypervisor 핵심 기능의 개발, 디버깅, 테스트에 참여합니다. VM / vCPU, 메모리 관리, 인터럽트, 디바이스 가상화 등을 포함합니다.
  - ARM64, RISC-V64 등 아키텍처 적응에 참여하고, 특권 레벨·예외·인터럽트·주소 변환 등 저수준 문제를 분석하고 해결합니다.
  - 가상화, RTOS, CPU 아키텍처 등 기술 방향으로 Research를 수행하고, 논문·기술 규격·오픈소스 구현·커뮤니티 자료를 읽어 기술 조사, 방안 설계, 검증 결론을 정리합니다.
  - QEMU, GDB, Shell, Trace 등 도구로 시스템 디버깅, 실험 검증, 문제 추적을 수행합니다.
  - 오픈소스 커뮤니티 협업에 참여해 Issue 분석, Patch 개발, 코드 리뷰 등 업스트림 기여를 수행합니다.
  - AI Agent를 활용해 코드 분석, 기술 조사, 개발, 디버깅, 테스트를 보조하고, Agent의 출력을 독립적으로 검증하고 개선할 수 있어야 합니다.
  reqs:
  - 컴퓨터, 소프트웨어, 전자, 자동화, 통신 등 관련 전공의 학부생 또는 대학원생이어야 합니다.
  - C 언어에 능숙하고 기본적인 Linux 개발 능력을 갖추어 Git, Shell 등 도구를 사용할 수 있어야 합니다.
  - 스레드, 인터럽트, 가상 메모리, MMU, 예외 처리 등 운영체제의 기본 개념을 이해해야 합니다.
  - 일정 수준의 Research 능력을 갖추어 영어 기술 자료, 논문, 아키텍처 매뉴얼, 오픈소스 코드를 주도적으로 검색하고 읽으며, 실험으로 자신의 분석과 판단을 검증할 수 있어야 합니다.
  - 코드 읽기, 문제 분해, 자기 주도 학습 능력이 좋고 임베디드 시스템, CPU 아키텍처 또는 가상화 기술에 관심이 있어야 합니다.
  - AI Agent / Coding Agent를 실제로 사용한 경험이 있고, Agent를 ‘소원 비는 식 프로그래밍’에 의존하지 않고 엔지니어링과 Research 도구로 활용할 수 있어야 합니다.
  - 매주 최소 3일 인턴십을 하고, 인턴 기간은 3개월 이상이어야 합니다.
  bonus:
  - RTOS, Linux 커널, Bootloader, 드라이버 또는 기타 저수준 시스템 개발 경험이 있으면 우대합니다.
  - ARM64 / RISC-V 특권 아키텍처, 페이지 테이블, 인터럽트 또는 하드웨어 가상화 메커니즘을 이해하고 있으면 우대합니다.
  - QEMU, GDB, Devicetree, Kconfig, CMake 또는 Python을 사용해 본 적이 있으면 우대합니다.
  - Hypervisor, KVM, Xen, IOMMU/SMMU 또는 디바이스 가상화를 접해 보았으면 우대합니다.
  - 논문 재현, 기술 조사, Benchmark / 실험 설계 또는 시스템 프로토타입 구현 경험이 있으면 우대합니다.
  - 오픈소스 기여 또는 시스템 소프트웨어 관련 교과목 / 개인 프로젝트 경험이 있으면 우대합니다.
  gains:
  - 주변부 Demo가 아닌 실제 임베디드 Hypervisor 핵심 기능 연구개발에 참여합니다.
  - RTOS, CPU 가상화, 메모리 격리, 디바이스 가상화, 다중 아키텍처 시스템 개발을 깊이 배웁니다.
  - Research, 방안 설계, 프로토타입 검증에서 엔지니어링 구현까지 이어지는 전 과정을 실천합니다.
  - AI Agent를 시스템 소프트웨어 연구개발과 기술 연구에 결합하는 업무 방식을 탐구합니다.
