  stipend: ECOS 팀 안내 참조
  slots: ''
  status: open
  desc: '지정된 알고리즘과 응용에 대해 프로그램 동작, 성능 병목, 아키텍처 특성 등을 분석하고, 소프트웨어 기법(병렬 계산, 벡터 계산, 메모리 접근 최적화 등), 소프트웨어·하드웨어 공동 설계, 전용 가속기 설계 같은 고성능 계산 방법으로 더 적은 하드웨어 자원에서 더 높은 프로그램 성능을 달성합니다. 고성능 RTL 시뮬레이터를 예로 들면, GSIM은 Chisel 언어를 지원하고 Verilator보다 10배 더 빨라 샹산의 테스트와 검증 효율을 크게 높였습니다. 현재 ECOS 팀은 EDA 소프트웨어 성능 최적화, 임베디드 시스템 성능 최적화, 그리고 앞으로 샹산에서의 소프트웨어 최적화에 많은 시간과 노력을 투입하고 있습니다.


    이 포지션은 ECOS 팀이 제공합니다. 관련 인턴 요건, 인턴 수당, 급여 등은 ECOS 팀 인턴·신입 공채·경력 채용 안내를 참고하십시오.


    이 포지션은 현장 인턴십이 필요하며, 중국과학원 계산기술연구소(소속 정원, 프로젝트 채용, 创嘉)나 베이징 오픈소스 칩 연구원 근무지로 입사할 수 있습니다. 일부 프로젝트의 선호를 제외하면 대부분 베이징이나 선전을 선택할 수 있습니다. 현재 슝안(생활비가 낮고 환경이 좋습니다)에도 사무소를 추가로 열고 있습니다.'
