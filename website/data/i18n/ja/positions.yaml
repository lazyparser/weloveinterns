  desc: '指定されたアルゴリズムとアプリケーションについて、プログラムの挙動、性能のボトルネック、アーキテクチャ上の特徴などを分析し、ソフトウェア的な手法（並列計算、ベクトル計算、メモリアクセス最適化など）、ソフト・ハード協調設計、専用アクセラレータ設計などの高性能計算手法を用いて、より少ないハードウェア資源でより高いプログラム性能を達成します。高性能 RTL シミュレータを例にとると、GSIM は Chisel 言語をサポートし、Verilator よりさらに 10 倍高速で、香山のテストと検証の効率を大きく高めています。現在、ECOS チームは EDA ソフトウェアの性能最適化、組み込みシステムの性能最適化、そして将来の香山上のソフトウェア最適化に、多くの時間と力を投じています。


