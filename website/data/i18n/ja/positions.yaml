- id: K183
  title: RT-Thread 組み込み開発
  org: 甲辰計画 · 五色石プロジェクト
  track: jiachen
  mode: リモート
  location: オンライン（リモート）
  level: LV1 以上
  stipend: インターン手当なし（RISC-V 開発ボードと Token を提供）
  slots: ''
  status: open
  desc: '注意：このポジションにはインターン手当が ありません。インターンに必要な RISC-V 開発ボード（甲辰計画の開発ボード漂流によるもの、またはメーカーからの直接提供）と Token を提供します。面接に合格すると、インターン契約とインターン証明書を発行します。契約先は上海苦芽科技有限公司です。


    インターンはメンターの指導のもと、RT-Thread オープンソースコミュニティに直接コードを貢献し、成果はすべて公開され確認できます。初級の成果を終えると、他の採用企業のインターン枠や新卒採用枠を推薦できます。


    本ポジションは甲辰計画の主宰者である呉偉（lazyparser）が立ち上げ、面接と養成を担当します。複数の RT-Thread 開発者・講師がメンターを務めます。五色石プロジェクトの一部です。'
  duties:
  - RT-Thread をベースに、各種ロボットの制御モジュールなど、組み込みアプリケーションの事例をいくつか作成します。
  - RT-Thread リポジトリにおける多様な RISC-V SoC のサポートを補完し、長期的に維持します。コミュニティメンテナの長期ロードマップに沿って育成します。
  - （任意）技術ブログを執筆し、RT-Thread の応用例を紹介・普及します。
  - （任意）動画を制作し、英語圏や東南アジアなどに向けて RT-Thread を広報します。
  - （任意）技術共有や公開講演などで自分のインターン成果を紹介することも歓迎します。
  reqs:
  - 組み込み開発とハードウェア統合に熱意があり、主体的に動き、自ら進んでコミュニケーションでき、インターンを通じて何を得たいのかを明確に説明できる方。
  - AI 大規模モデルと各種 Harness を日常のワークフローに使いこなせる方。
  - LV1 以上の技術能力を備えている方。
  - 3 か月以上安定してインターンできる方（オンライン・リモート、毎週進捗があれば可）。
