  stipend: ECOS チームの説明を参照
  slots: ''
  status: open
  desc: '「一生一芯」（ysyx.org）は、中国科学院大学が発起した大規模でオープンな公益性のチップおよびシステム人材育成計画です。学生が独立して問題を分解し解決する能力、ならびに「計算機のソフトウェアとハードウェアシステムを協調して設計する能力」と「チップの全チェーンを設計する能力」の養成に力を注ぎ、通年で応募を受け付け、学校、専攻、学年を問わず参加できます。2019 年の発起以来、累計の応募者は 16000 人を超え、国内外の 1100 余りの大学をカバーしています。過去の受講者は華為海思、寒武紀、摩爾線程、海光、嘉楠科技などの業界トップ企業に就職し、あるいは中国科学院、清華大学、北京大学、香港科技大学、カーネギーメロン大学など国内外のトップ校に進学しています。「一生一芯」は専任ティーチングアシスタントのポジションを新たに設けました。技術の研鑽に専念したい方、コミュニティづくりが好きな方、コミュニケーションを好む方にとくに向いています。専任ティーチングアシスタントの力は、半分を技術力の向上、自分が関心のあるオープンソース技術プロジェクトの主導または参加に、半分を ECOS チームの技術経験をより多くの受講者に伝えること（指導や共有の企画など）に使います。


    本ポジションは ECOS チームが提供しています。関連するインターン要件、インターン手当、給与などはECOS チームのインターン・新卒採用・中途採用の説明を参照してください。


