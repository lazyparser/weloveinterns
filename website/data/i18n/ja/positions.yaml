  desc: 'ECOS チームが自社開発した、あるいは市場で主流の RISC-V アーキテクチャプロセッサチップを中心に、PCB ボード、組み込み SDK、組み込み開発ツール、代表的な応用例を設計し、あわせてチップマニュアルとボードの利用ドキュメントを執筆します。ECOS チームが提供するチップの多くは、オープンソースのプロセッサコアとオープンソース EDA を基に、SoC 統合、物理設計、テープアウト、パッケージング、ボード設計といった工程を自社で完了しています。組み込みチームはチップチームと密接に協働し、チップ仕様の定義、SoC 統合、検証などの業務にも参加できます。ECOS で組み込みシステムの仕事に携われば、ソフトもハードも分かるフルスタックの高水準な組み込みエンジニアへと徐々に成長できます。組み込みチームには、ロボット、組み込みゲーム、携帯ゲーム機、知育玩具など、さまざまな応用を試す余地が大きくあります。


