  desc: 'ECOS Studio：ECOS チームの成果を統合し、一つの IDE ツールにまとめたものです。チップの設計はすべてオープンソース EDA とオープンソース IP で行い、全工程をオープンソースにし、公開できます。誰でもこのフローを基に自分のチップ設計案を変更・実装でき、高価な EDA と IP の費用を払う必要はありません。Verilog/Chisel/SpinalHDL/SystemVerilog で書かれたデジタルモジュールは、オープンソース EDA と SoC を使って自分の設計案の PPA を ASIC フロー上で評価でき、レイアウト設計を終えた後にテープアウトに回すこともできます。ECOS Studio には二つの形態（ローカル IDE とクラウドプラットフォーム）があります。そのため、オープンソースチップを認め、同時に UI 開発や web 開発に関心のある学生にとても向いています。


