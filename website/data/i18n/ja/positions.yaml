- id: A180
  title: 組み込み仮想化 / Hypervisor インターン
  org: 进程使命科技有限公司
  track: partner
  mode: オンサイト
  location: 上海（希望）· 北京
  level: 未記載（学部生または大学院生）
  stipend: 未記載
  slots: ''
  status: open
  desc: 本ポジションは进程使命科技有限公司からのものです。オンサイトのインターン（上海）のみ受け付けます。进程使命のその他の採用情報は以下のアドレスから取得できます。
  duties:
  - VM / vCPU、メモリ管理、割り込み、デバイス仮想化など、組み込み Hypervisor の中核機能の開発・デバッグ・テストに参加します。
  - ARM64、RISC-V64 などのアーキテクチャへの適合に参加し、特権レベル、例外、割り込み、アドレス変換などの低レイヤの問題を分析・解決します。
  - 仮想化、RTOS、CPU アーキテクチャなどの技術領域でリサーチを行い、論文、技術仕様、オープンソース実装、コミュニティ資料を読み、技術調査、設計案、検証結果をまとめます。
  - QEMU、GDB、Shell、Trace などのツールを使って、システムのデバッグ、実験による検証、問題の特定を行います。
  - オープンソースコミュニティの協働に参加し、Issue の分析、Patch の開発、コードレビューなどの上流貢献を担います。
  - AI Agent を活用してコード分析、技術調査、開発、デバッグ、テストを行い、Agent の出力を自分で検証・改善できること。
  reqs:
  - 計算機、ソフトウェア、電子、自動化、通信などの関連専攻の学部生または大学院生。
  - C 言語に習熟し、基本的な Linux 開発能力を備え、Git、Shell などのツールを使いこなせる方。
  - スレッド、割り込み、仮想メモリ、MMU、例外処理など、オペレーティングシステムの基本概念を理解している方。
  - 一定のリサーチ能力があり、英語の技術資料、論文、アーキテクチャマニュアル、オープンソースコードを自ら検索して読み、実験によって自分の分析と判断を検証できる方。
  - コードを読む力、問題を分解する力、自主的に学ぶ力があり、組み込みシステム、CPU アーキテクチャ、仮想化技術に関心がある方。
  - AI Agent / Coding Agent の実使用経験があり、Agent を工学とリサーチのツールとして使いこなせる方（「願掛け式プログラミング」に頼らないこと）。
  - 毎週少なくとも 3 日インターンでき、インターン期間が 3 か月以上ある方。
  bonus:
  - RTOS、Linux カーネル、Bootloader、ドライバなど、低レイヤのシステム開発経験。
  - ARM64 / RISC-V の特権アーキテクチャ、ページテーブル、割り込み、ハードウェア仮想化の仕組みの理解。
  - QEMU、GDB、Devicetree、Kconfig、CMake、Python の使用経験。
  - Hypervisor、KVM、Xen、IOMMU/SMMU、デバイス仮想化に触れた経験。
  - 論文の再現、技術調査、Benchmark / 実験設計、システムプロトタイプの実装経験。
  - オープンソースへの貢献、またはシステムソフトウェア関連の授業・個人プロジェクトの経験。
  gains:
  - 周辺の Demo ではなく、実際の組み込み Hypervisor の中核機能の研究開発に参加できます。
  - RTOS、CPU 仮想化、メモリ分離、デバイス仮想化、マルチアーキテクチャのシステム開発を深く学べます。
  - リサーチ、設計案、プロトタイプ検証から工学実装までの技術の道筋を一通り実践できます。
  - AI Agent とシステムソフトウェア開発・技術研究を組み合わせる働き方を探れます。
  - 実際のオープンソースコミュニティの協働に参加し、成果の一部を上流コミュニティに貢献できます。
  links:
  - label: www.liepin.com
    url: https://www.liepin.com/company/21491191/
