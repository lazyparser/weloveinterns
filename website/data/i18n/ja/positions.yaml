- id: B179
  title: 仮想化とリアルタイム OS の開発インターン
  badge: 2 名募集中
  org: メンバー組織（提供元はリポジトリに記載なし）
  track: partner
  mode: 未記載
  location: 未記載
  level: LV3 以上
  stipend: 未記載
  slots: 2 名
  status: open
  desc: 国産 ARM SoC プラットフォームを対象に、仮想化とリアルタイム OS の移植・適合とリアルタイム性のチューニングを行います。Hypervisor、RTOS カーネル、Linux ドライバの三層に同時に触れることになります。
  duties:
  - Bao Hypervisor のプラットフォーム適合：Renesas、NXP、Rockchip の MCU 上で Bootstrap、割り込みコントローラ、メモリと Cache のパーティション、デバイスパススルーと VirtIO バックエンドを実装し、プラットフォームの BSP/MCAL を開発・使用します。
  - RTOS カーネルの移植：MMU とユーザー空間プロセスモデルを有効にし、プロセス間のアドレス空間分離を確立します。
  - ARM プラットフォームのドライバ開発：Linux と RTOS 双方のドライバ適合、およびコア間通信チャネル（Mailbox / 共有メモリ）の設計と実装。
  - AMP と仮想化の混在配置：A コア側で Hypervisor を動かして Linux と RTOS を共存させ、R コア側でハードリアルタイムタスクを担います。両ドメインのリソース分離（Cache / NPU のパーティションを含む）と起動フローを担当します。
  - リアルタイム性の計測とチューニング：コンテキストスイッチ、割り込み応答、制御周期のジッタをマイクロ秒単位で計測し、再現可能な試験方法を確立してデータを出します。
  - RTOS への Rust の導入：RTOS が Rust 製のアプリケーションとミドルウェア（std ライブラリ、非同期機構）を実行できるようにし、カーネルモジュールを段階的に Rust へ移行します（Good To Have）。
  - 静的コード解析と認証に関わるコーディング規約（Good To Have）。
  reqs:
  - LV3 以上で、低レイヤのプログラミングに強い関心がある方；
  - C とアセンブリ言語に習熟している方；
  - Linux カーネルとドライバ開発に詳しく、ARM プラットフォームでの Linux ドライバ開発経験がある方を優先します；
  - 少なくとも一つの RTOS（RT-Thread / FreeRTOS / Zephyr など）を知り、POSIX インターフェースモデルを理解している方；
  - オペレーティングシステム、スケジューリング、リアルタイムシステムの知識があり、リアルタイム性の指標の定義と計測方法を理解している方；
  - 確かな計算機アーキテクチャとプロセッサの知識：ARMv8-A / ARMv8-R、例外レベル、MMU / MPU、GIC、Cache コヒーレンシ；
  - Git、SSH、Bash Script などの小さなツールを使いこなして効率を上げられる方；
  - ハードウェアのデバッグインターフェースとハードウェアデバッガ（JTAG / シリアル / ロジックアナライザ / オシロスコープ）について基本的に理解している方；
  - 計算機工学、電気工学、計算機科学の学士号または修士号。
  bonus:
  - Rust、とくに組み込みや no_std の方向；
  - いずれかの仮想化ソリューション（Bao / Jailhouse / Xen / KVM）に触れた経験；
  - ヘテロジニアスなマルチコア AMP アーキテクチャ、コア間通信の実務経験；
  - 機能安全や自主制御可能の認証に関わる開発プロセスの経験；
  - 静的解析ツールの使用経験（MISRA C、Coverity、clang-analyzer など）；
  - オープンソースコミュニティへの貢献実績。
  gains:
  - 実際に量産されているプロジェクトでのチッププラットフォーム適合、Hypervisor と RTOS の移行チェーン全体、そして Rust の安全重要システムへの実装 —— これらの仕事は顧客の Safety Critical 製品に直接入るもので、練習用のプロジェクトではありません。
- id: H178
  title: エンボディド AI ハードウェア開発インターン（巧緻ハンド方向）
  org: 合肥工業大学数学学院 RISC-V 生態系ラボ（準備中）
