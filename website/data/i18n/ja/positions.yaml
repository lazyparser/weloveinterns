  desc: '中低価格帯の RISC-V オープンソースプロセッサコア IP を研究開発し、低消費電力や組み込みシステム設計などを重視します。ここで ECOS チームがプロセッサコアを開発する際は、PPA の品質を重視し、プロセッサコアのカスタマイズ性の向上に力を入れ、アクセラレータ部品やカスタム拡張命令の柔軟な統合を可能にしています。あわせて、RISC-V の主要な応用場面に向けて周辺 IP と必要な計算 IP を開発します。例えば AMBA、SDRAM、VGA、UART、I2C、PWM、QSPI、組み込み向けグラフィック GPU、Bluetooth、Ethernet などです。


