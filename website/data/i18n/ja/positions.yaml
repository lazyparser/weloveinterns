- id: E169
  title: オープンソース RISC-V 高性能 IP 設計
  badge: オンサイトインターン、新卒エンジニア職、研究職のいずれも枠あり
  org: ECOS チーム
  track: ecos
  mode: オンサイト
  location: 北京 · 深圳（一部プロジェクトは選択可；雄安は準備中）
  level: 未記載（新卒エンジニア職、研究職のいずれも枠あり）
  stipend: ECOS チームの説明を参照
  slots: ''
  status: open
  desc: '「香山」オープンソース高性能 RISC-V プロセッサは、現在の世界のオープンソース RISC-V プロセッサコアで最高水準の性能を代表しています。最新のテープアウト版「昆明湖 V2」は SPECCPU2006 ベンチマークで 45 点@3GHz（すなわち 15 点/GHz）の成績を達成しました。この性能水準は、現在の業界主流の ARM サーバーチップ（例えば鯤鵬 920 や倚天 710）が採用する ARM Neoverse N1/N2 級のコアと同じ土俵で競争できる能力をすでに備えています。


    現在、「香山」チームはデータセンター向けの次世代高性能 RISC-V プロセッサコア「昆明湖 V3」の研究開発に取り組んでいます。このバージョンは業界トップクラスのデータセンター向けプロセッサコア ARM Neoverse V2 を目標とします。「昆明湖 V3」の設計目標は、SPEC2006 性能ベンチマークで 22 点/GHz の性能水準に達することであり、より高い性能と十分な競争力のある電力効率を備え、RISC-V アーキテクチャがデータセンターや高性能計算などの分野で突破を遂げることをさらに後押しします。


    「香山」チームはフルスタックでオープンソースという理念を貫き、マイクロアーキテクチャ文書、RTL ソースコード、関連する開発プラットフォームツールをすべて GitHub で完全に公開しています。プロジェクトチームは高度に開かれた開発チームと技術コミュニティを築いており、高度なコンピュータアーキテクチャ、高性能演算子の実装、メモリサブシステムの最適化、マルチコア相互接続アーキテクチャ、ベクトル拡張（RVV）、プロセッサセキュリティのいずれの分野を志す方でも、「香山」に好きで自分に合った方向が見つかります。


    「香山」プロセッサは香山チームが主導して設計し、ECOS チームが技術の研究開発と人材育成に深く参加しています。


    本ポジションは ECOS チームが提供しています。関連するインターン要件、インターン手当、給与などはECOS チームのインターン・新卒採用・中途採用の説明を参照してください。


    本ポジションはオンサイトのインターンが必要で、中国科学院計算技術研究所（所編・プロジェクト雇用・創嘉）、または北京オープンソースチップ研究院の勤務地を選んで入職できます。少数のプロジェクトに希望があるほかは、多くは北京・深圳を選べます。あわせて雄安（生活コストが低く環境が良い）を増設中です。'
