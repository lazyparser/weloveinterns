  status: open
  desc: 'オープンソース EDA ツールとツールチェーン。オープンソース EDA ツールチェーンがチップに対して果たす役割は、GCC/LLVM がオープンソースソフトウェア生態系に対して果たす役割と同じです。ECOS チームはオープンソース EDA ツールチェーンを構築し、シミュレーション検証、論理合成、物理設計、物理検証といったチップ設計の中核工程をカバーして、チップの全工程設計を支えます。そうなれば、将来、一人ひとりの学生やチップ愛好家がオープンソースソフトウェアで自分のチップを設計し、レイアウトを得てテープアウトし生産できるようになります。これは間違いなく壮大な事業です。オープンソース EDA という一つの仕事だけでも、ECOS はすでに数百人を投入し（2018 年から）、開発したコード量は 50 万行近くに達し、2023 年にオープンソース EDA ツールのフローを初歩的に通し、iEDA プロジェクトを公開しました。今後何年にもわたり、ECOS は工程の品質、アルゴリズムの性能、実行効率などの面から、オープンソース EDA の品質を継続的に最適化・向上させていきます。大規模なソフトウェアアーキテクチャ、ソフトウェアの工程品質、プログラムの実行効率に関心のある学生の参加を歓迎します。


    本ポジションは ECOS チームが提供しています。関連するインターン要件、インターン手当、給与などはECOS チームのインターン・新卒採用・中途採用の説明を参照してください。


    本ポジションはオンサイトのインターンが必要で、中国科学院計算技術研究所（所編・プロジェクト雇用・創嘉）、または北京オープンソースチップ研究院の勤務地を選んで入職できます。少数のプロジェクトに希望があるほかは、多くは北京・深圳を選べます。あわせて雄安（生活コストが低く環境が良い）を増設中です。'
