# handle — имя пользователя GitHub (для ссылки на профиль); при отсутствии публичного handle поле пустое, карточка рисует значок с первой буквой.
# endorse — номер поручительства талантов Цзячэнь или пояснение; включено только то, что в репозитории опубликовано с согласия человека или по его собственному PR.

