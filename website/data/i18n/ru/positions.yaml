  name: Команда ECOS
  note: Стажировка офлайн; можно оформиться в Институт вычислительной техники Китайской академии наук (штат института, договор по проекту, «Чуанцзя») или в Пекинский институт открытых чипов. Для большинства позиций можно выбрать Пекин или Шэньчжэнь, офис в Сюнъане строится.
