  desc: 'Открытые EDA-инструменты и тулчейны значат для чипов то же, что GCC/LLVM для экосистемы открытого ПО. Команда ECOS строит открытый EDA-тулчейн, покрывающий ключевые этапы проектирования чипа — симуляцию и верификацию, логический синтез, физическое проектирование, физическую верификацию, — и поддерживает полный цикл проектирования. Тогда каждый студент и любитель чипов сможет проектировать собственный чип открытым ПО, получать топологию и отправлять её в производство. Это, безусловно, огромная работа. Только в открытой EDA команда ECOS с 2018 года задействовала сотни человек и написала около 500 тысяч строк кода, а в 2023 году впервые прошла сквозной маршрут открытых EDA-инструментов и выпустила проект iEDA . В ближайшие годы ECOS будет непрерывно улучшать качество открытой EDA с точки зрения инженерного качества, производительности алгоритмов и эффективности работы. Приглашаются те, кому интересны архитектура больших программных систем, инженерное качество ПО и эффективность выполнения
    программ.

    Позицию предоставляет команда ECOS. Требования к стажировке, стипендия и зарплата — см. Пояснения команды ECOS о стажировках, наборе выпускников и найме.

