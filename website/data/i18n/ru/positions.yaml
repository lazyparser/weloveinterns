  desc: 'Вокруг собственных или распространённых на рынке процессорных чипов архитектуры RISC-V команда ECOS проектирует печатные платы, встраиваемые SDK, инструменты встраиваемой разработки и типовые прикладные кейсы, а также пишет к ним руководства по чипам и документацию по платам. Большинство чипов ECOS основаны на открытых процессорных ядрах и открытой EDA: команда сама выполняет интеграцию SoC, физическое проектирование, запуск в производство (tapeout), корпусирование и проектирование плат. Команда встраиваемых систем тесно работает с командой чипов и может участвовать в определении спецификаций чипа, интеграции и верификации SoC. Работа в ECOS над встраиваемыми системами позволяет постепенно вырасти в высококлассного инженера полного стека, который «знает и софт, и железо». У команды большой простор для поиска применений и разных занятных вещей: роботы, встраиваемые игры, карманные консоли, умные игрушки и т. п.

