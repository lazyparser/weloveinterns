  desc: 'ECOS Studio объединяет результаты всей команды ECOS в набор IDE-инструментов: чипы проектируются целиком на открытой EDA и открытом IP, весь процесс открыт и доступен для изучения. Любой может на основе этого процесса изменить и реализовать собственный проект чипа, не платя дорого за EDA и IP. Каждый цифровой модуль, написанный на Verilog/Chisel/SpinalHDL/SystemVerilog, можно оценить по PPA в ASIC-процессе на открытой EDA и SoC или, завершив проектирование топологии, отправить в производство. ECOS Studio существует в двух формах (локальная IDE и облачная платформа), поэтому позиция хорошо подходит тем, кто признаёт открытые чипы и при этом интересуется разработкой UI и веб-разработкой.

