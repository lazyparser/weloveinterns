- id: B179
  title: Стажёр по разработке виртуализации и операционных систем реального времени
  badge: Открыто 2 места
  org: Организация-участник (в репозитории не указана)
  track: partner
  mode: Не указано
  location: Не указано
  level: LV3 и выше
  stipend: Не указано
  slots: '2'
  status: open
  desc: 'Для китайских платформ ARM SoC: портирование, адаптация и настройка реального времени для виртуализации и операционной системы реального времени. Стажёр одновременно работает с тремя слоями: Hypervisor, ядро RTOS и драйверы Linux.'
  duties:
  - 'Адаптация платформы Bao Hypervisor: на MCU Renesas, NXP и Rockchip реализовать Bootstrap, контроллер прерываний, разделение памяти и Cache, проброс устройств и бэкенд VirtIO; разработка и использование BSP/MCAL платформы.'
  - 'Портирование ядра RTOS: включение MMU и модели пользовательских процессов, изоляция адресных пространств между процессами.'
  - 'Разработка драйверов платформы ARM: адаптация драйверов на стороне Linux и RTOS, проектирование и реализация каналов межъядерной связи (Mailbox / разделяемая память).'
  - 'Совместное развёртывание AMP и виртуализации: на ядрах A Hypervisor обеспечивает сосуществование Linux и RTOS, на ядрах R выполняются задачи жёсткого реального времени; ответственность за изоляцию ресурсов двух доменов (включая разделение Cache / NPU) и за порядок загрузки.'
  - 'Измерение и настройка реального времени: микросекундные измерения переключения контекста, реакции на прерывания и джиттера цикла управления, воспроизводимая методика тестирования и публикация данных.'
  - 'Внедрение Rust в RTOS: дать RTOS возможность исполнять Rust-приложения и middleware (std, асинхронные механизмы) и постепенно переводить модули ядра на Rust (Good To Have).'
  - Статический анализ кода и стандарты кодирования, связанные с сертификацией (Good To Have).
  reqs:
  - LV3 и выше, сильный интерес к низкоуровневому программированию;
  - уверенное владение языком C и ассемблером;
  - знание ядра Linux и разработки драйверов, опыт разработки драйверов Linux на платформах ARM — преимущество;
  - знакомство хотя бы с одной RTOS (RT-Thread / FreeRTOS / Zephyr и др.), понимание модели интерфейсов POSIX;
  - знания операционных систем, планирования и систем реального времени, понимание определения показателей реального времени и методов их измерения;
  - 'прочные знания архитектуры компьютеров и процессоров: ARMv8-A / ARMv8-R, уровни исключений, MMU / MPU, GIC, когерентность Cache;'
  - уверенное владение Git, SSH, Bash Script и другими небольшими инструментами для повышения эффективности;
  - базовое понимание интерфейсов аппаратной отладки и аппаратных отладчиков (JTAG / последовательный порт / логический анализатор / осциллограф);
  - степень бакалавра или магистра по компьютерной инженерии, электротехнике или информатике.
  bonus:
  - Rust, особенно встраиваемый или no_std;
  - опыт работы с любым решением виртуализации (Bao / Jailhouse / Xen / KVM);
  - практический опыт с гетерогенными многоядерными архитектурами AMP и межъядерной связью;
  - опыт процессов разработки, связанных с функциональной безопасностью или сертификацией на технологическую независимость;
  - опыт использования инструментов статического анализа (MISRA C, Coverity, clang-analyzer и др.);
