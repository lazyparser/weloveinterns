- id: K183
  title: Встраиваемая разработка на RT-Thread
  org: Проект Цзячэнь · проект «Пятицветный камень»
  track: jiachen
  mode: Удалённо
  location: Удалённо, онлайн
  level: LV1 и выше
  stipend: Без стипендии (предоставляются отладочная плата RISC-V и Token)
  slots: ''
  status: open
  desc: 'Внимание: у этой позиции нет стипендии. Предоставляются отладочная плата RISC-V, необходимая для стажировки (из дрейфа плат Проекта Цзячэнь или напрямую от производителя), и Token. После успешного собеседования заключается договор о стажировке и выдаётся справка о ней. Договор подписывается с шанхайской компанией Kubuds.

    Под руководством наставника стажёр напрямую вносит код в открытое сообщество RT-Thread; все результаты открыты и проверяемы. После первых результатов стажировки можно получить рекомендации на стажировки и позиции для выпускников у других работодателей.

    Позицию запустил руководитель Проекта Цзячэнь Wu Wei (lazyparser): он проводит собеседования и отвечает за подготовку, а наставниками выступают несколько разработчиков и преподавателей RT-Thread. Позиция — часть проекта «Пятицветный камень».'
  duties:
  - Делать на базе RT-Thread примеры встраиваемых приложений — в том числе модули управления различными роботами.
  - Дополнять поддержку разных SoC RISC-V в репозитории RT-Thread и вести её долгосрочно, расти по долгосрочному маршруту мейнтейнера сообщества
  - (по желанию) писать технические статьи, рассказывающие о прикладных примерах RT-Thread и продвигающие их.
  - (по желанию) делать видеоматериалы для продвижения RT-Thread, в том числе для англоязычного мира и Юго-Восточной Азии.
  - (по желанию) приветствуется участие в открытых технических докладах с рассказом о своей работе на стажировке.
  reqs:
  - Интерес к встраиваемой разработке и интеграции с оборудованием, инициативность, умение активно общаться и ясно понимать, что человек хочет получить от стажировки.
  - Уверенное использование больших AI-моделей и различных harness-инструментов в повседневном рабочем процессе.
  - Технический уровень LV1 и выше.
  - Способность стабильно стажироваться более 3 месяцев (удалённо, достаточно прогресса каждую неделю).
- id: K182
  title: Разработка кейсов embodied AI на openKylin
  org: Проект Цзячэнь · проект «Пятицветный камень»
  track: jiachen
  mode: Удалённо
  location: Удалённо, онлайн
  level: LV2 и выше
  stipend: Без стипендии (предоставляются отладочная плата RISC-V и Token)
  slots: ''
  status: open
  desc: 'Внимание: у этой позиции нет стипендии. Предоставляются отладочная плата RISC-V, необходимая для стажировки (из дрейфа плат Проекта Цзячэнь или напрямую от производителя), и Token. После успешного собеседования заключается договор о стажировке и выдаётся справка о ней. Договор подписывается с шанхайской компанией Kubuds. Под руководством наставника стажёр напрямую вносит код в открытое сообщество openKylin; все результаты открыты и проверяемы. Кейсы embodied AI, сделанные в рамках стажировки, должны быть опубликованы под открытой лицензией. После первых результатов стажировки можно получить рекомендации на стажировки и позиции для выпускников у других работодателей.

    Позицию запустил мейнтейнер ROS SIG openKylin и руководитель Проекта Цзячэнь Wu Wei (lazyparser): он проводит собеседования и отвечает за подготовку. Позиция — часть проекта «Пятицветный камень».'
