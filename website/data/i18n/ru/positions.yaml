  desc: 'Для заданных алгоритмов и приложений — анализ поведения программы, узких мест производительности и архитектурных особенностей. Программными методами (параллельные вычисления, векторные вычисления, оптимизация доступа к памяти), совместным проектированием аппаратуры и ПО и специализированными ускорителями достигается более высокая производительность при меньших аппаратных ресурсах. Пример — высокопроизводительный RTL-симулятор GSIM: он поддерживает язык Chisel и работает в 10 раз быстрее Verilator, что заметно ускорило тестирование и верификацию «Сяншань». Сейчас команда ECOS вкладывает много времени и сил в оптимизацию производительности EDA-ПО, встраиваемых систем, а в будущем — ПО для «Сяншань».

