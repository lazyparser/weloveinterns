- id: A180
  title: Стажёр по встраиваемой виртуализации / Hypervisor
  org: Jincheng Shiming Technology Co., Ltd.
  track: partner
  mode: Офлайн
  location: Шанхай (желательно) · Пекин
  level: Не указано (студент бакалавриата или магистратуры)
  stipend: Не указано
  slots: ''
  status: open
  desc: Позиция от компании Jincheng Shiming Technology Co., Ltd. Принимается только офлайн-стажировка (Шанхай). Другие вакансии компании доступны по адресу ниже.
  duties:
  - Участвовать в разработке, отладке и тестировании ключевых функций встраиваемого Hypervisor, включая VM / vCPU, управление памятью, прерывания и виртуализацию устройств.
  - 'Участвовать в адаптации под архитектуры ARM64, RISC-V64 и другие, анализировать и решать низкоуровневые задачи: уровни привилегий, исключения, прерывания, преобразование адресов.'
  - 'Проводить Research по виртуализации, RTOS, архитектуре CPU и смежным направлениям: читать статьи, технические спецификации, открытые реализации и материалы сообществ и оформлять результат в виде технического обзора, проектного решения и выводов проверки.'
  - Выполнять системную отладку, экспериментальную проверку и локализацию проблем инструментами QEMU, GDB, Shell, Trace.
  - 'Участвовать в работе открытого сообщества: анализировать Issue, разрабатывать Patch, проводить ревью кода и делать другие вклады в upstream.'
  - Использовать AI Agent для анализа кода, технического исследования, разработки, отладки и тестирования, самостоятельно проверяя и дорабатывая результаты Agent.
  reqs:
  - Студент бакалавриата или магистратуры по информатике, программной инженерии, электронике, автоматике, связи и смежным специальностям.
  - Знание языка C, базовые навыки разработки под Linux, владение Git, Shell и подобными инструментами.
  - 'Понимание базовых понятий операционных систем: потоков, прерываний, виртуальной памяти, MMU и обработки исключений.'
  - 'Способность к самостоятельному Research: активно искать и читать англоязычные технические материалы, статьи, руководства по архитектуре и открытый код, проверять свои выводы и суждения экспериментами.'
  - Хорошие навыки чтения кода, декомпозиции задач и самостоятельного обучения, интерес к встраиваемым системам, архитектуре CPU или виртуализации.
  - Практический опыт использования AI Agent / Coding Agent как инженерного и исследовательского инструмента, а не как «программирования по щучьему велению».
  - Не менее 3 дней в неделю, срок стажировки не менее 3 месяцев.
  bonus:
  - Опыт разработки RTOS, ядра Linux, Bootloader, драйверов или других низкоуровневых систем.
  - Понимание привилегированной архитектуры ARM64 / RISC-V, таблиц страниц, прерываний или механизмов аппаратной виртуализации.
  - Опыт работы с QEMU, GDB, Devicetree, Kconfig, CMake или Python.
  - Знакомство с Hypervisor, KVM, Xen, IOMMU/SMMU или виртуализацией устройств.
  - Опыт воспроизведения статей, технических исследований, Benchmark / планирования экспериментов или реализации системных прототипов.
  - Вклад в открытые проекты или курсовые / личные проекты по системному ПО.
  gains:
  - Участие в реальной разработке ключевых функций встраиваемого Hypervisor, а не в периферийных демо.
  - Углублённое изучение RTOS, виртуализации CPU, изоляции памяти, виртуализации устройств и разработки под несколько архитектур.
  - 'Практика полного технического пути: Research, проектирование решения, проверка прототипа, инженерная реализация.'
  - Освоение рабочего подхода, соединяющего AI Agent с разработкой системного ПО и техническими исследованиями.
  - Участие в реальной работе открытого сообщества с передачей части результатов в upstream.
