  slots: ''
  status: open
  desc: 'Открытый высокопроизводительный RISC-V процессор «Сяншань» представляет сегодня самый высокий уровень производительности среди открытых процессорных ядер RISC-V в мире . Его последняя выпущенная в кремнии версия «Куньминху V2» в тесте SPECCPU2006 достигает 45 баллов при 3 ГГц (то есть 15 баллов/ГГц). Этого уровня уже достаточно, чтобы конкурировать с основными серверными чипами ARM (например, Kunpeng 920 и Yitian 710), которые используют ядра уровня ARM Neoverse N1/N2.

    Сейчас команда «Сяншань» разрабатывает следующее поколение высокопроизводительного ядра RISC-V для дата-центров — «Куньминху V3». Версия ориентируется на топовое ядро для дата-центров ARM Neoverse V2. Цель «Куньминху V3» — 22 балла/ГГц в тесте SPEC2006, более высокая производительность и достаточная конкурентоспособность по энергоэффективности, чтобы продвинуть прорыв архитектуры RISC-V в дата-центрах и высокопроизводительных вычислениях.

    Команда «Сяншань» придерживается полной открытости стека: документация по микроархитектуре, исходный код RTL и инструменты платформы полностью открыты на GitHub. Вокруг проекта построены открытая команда разработки и техническое сообщество: чем бы вы ни занимались — продвинутой архитектурой, реализацией высокопроизводительных операторов, оптимизацией подсистемы памяти, многоядерными interconnect-архитектурами, векторными расширениями (RVV) или безопасностью процессоров, — в «Сяншань» найдётся интересное и подходящее направление.

    Процессор «Сяншань» спроектирован под руководством команды «Сяншань»; команда ECOS глубоко участвует в технической разработке и подготовке кадров.

    Позицию предоставляет команда ECOS. Требования к стажировке, стипендия и зарплата — см. Пояснения команды ECOS о стажировках, наборе выпускников и найме.

    Стажировка только офлайн: можно оформиться в Институт вычислительной техники Китайской академии наук (штат института, договор по проекту, «Чуанцзя») или в офис Пекинского института открытых чипов; за редкими исключениями для отдельных проектов большинство может выбрать Пекин или Шэньчжэнь. Кроме того, открывается офис в Сюнъане (низкая стоимость жизни и хорошая обстановка).'
