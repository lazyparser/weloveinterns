  status: open
  desc: '«Один студент — один чип» (ysyx.org) — масштабная открытая некоммерческая программа подготовки кадров в области чипов и систем, запущенная Университетом Китайской академии наук. Она учит самостоятельно разбирать и решать задачи, а также «сквозному проектированию аппаратно-программных систем» и «проектированию чипа по всей цепочке». Заявки принимаются круглый год, без ограничений по вузу, специальности и курсу. С момента запуска в 2019 году заявки подали более 16 000 человек из более чем 1100 вузов Китая и зарубежья. Выпускники программы работают в HiSilicon, Cambricon, Moore Threads, Hygon, Canaan и других лидирующих компаниях отрасли или продолжают учёбу в КАН, Университете Цинхуа, Пекинском университете, Гонконгском научно-техническом университете, Университете Карнеги — Меллона и других ведущих вузах. В программе появилась позиция штатного ассистента — она особенно подходит тем, кто сосредоточен на техническом росте, любит сообщества и общение. Половина усилий ассистента уходит
    на рост технической квалификации, ведение или участие в интересных открытых проектах, половина — на передачу технического опыта команды ECOS другим учащимся (наставничество, организация докладов и т. п.).

