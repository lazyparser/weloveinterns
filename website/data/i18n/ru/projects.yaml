# Открытые проекты: две группы — то, что запущено Проектом Цзячэнь вместе с участниками, и то, что рекомендовано стажёрам для старта.
# url — публичные репозитории и сайты, проверенные на доступность 2026-10-31.

jiachen:
  - name: "Совместный набор и подготовка стажёров в open source"
    url: https://github.com/lazyparser/weloveinterns
    desc: "Тот самый репозиторий, на котором стоит этот сайт. Более 3000 позиций и более 1000 стажировок за всё время — главный вход в эту систему подготовки кадров."
    tag: "Кадры"
  - name: "Взаимное признание талантов Проекта Цзячэнь"
    url: https://github.com/rv2036/jiachen-builders-network
    desc: "Сеть доверия, где поручительства дают люди: поручительство № 0 подписано самим руководителем программы, всё открыто проверяемо на GitHub и соотносится с системой уровней стажёров PLCT."
    tag: "Выявление талантов"
  - name: "Свободный дрейф простаивающих плат RISC-V"
    url: https://github.com/rv2036/riscv-board-wandering
    desc: "«Каждая плата RISC-V заслуживает быть включённой и любимой». И передача, и получение идут через баллы дрейфа, а любое пожертвование — дело доброй воли."
    tag: "Аппаратура"
  - name: RuyiSDK
    url: https://github.com/ruyisdk/ruyisdk
    desc: "Среда разработки и менеджер пакетов (ruyi) для разработчиков RISC-V: получение и настройка тулчейнов, симуляторов и системных образов сводятся к нескольким командам."
    tag: "Инструменты разработчика"
  - name: "Проект документальной энциклопедии RISC-V"
    url: https://rv2036.org
    desc: "Документальный проект, запущенный организациями — участниками Проекта Цзячэнь: цель — чтобы китайские технические материалы по RISC-V перестали быть разрозненными."
    tag: "Документация"
  - name: "RVSPOC / RV New 32-bit"
    url: https://rv2036.org/blog
    desc: "Две специализированные программы вокруг программной экосистемы RISC-V; детали и ход работ — в объявлениях Проекта Цзячэнь."
    tag: "Экосистема"
  - name: "Конкурс по безопасности чипов RISC-V"
    url: https://rv2036.org/blog
    desc: "Соревнование по направлению безопасности чипов RISC-V, связано с системой выявления талантов."
    tag: "Соревнования"
  - name: "Проект Tushan"
    url: https://rv2036.org/blog
    desc: "Спроектировать с помощью AI высокопроизводительный процессор RISC-V для ноутбуков: производительность и энергопотребление CPU/GPU на уровне Apple M1, производство на фабриках в трёх регионах, поставка тысячи машин к китайскому Новому году года Цзи-ю (2029)."
    tag: "Чипы"

community:
  - name: PicoClaw
    url: https://github.com/sipeed/picoclaw
    desc: "Минималистичный фреймворк AI-ассистента от Sipeed: «маленький, быстрый, разворачивается где угодно» — хорошо подходит как первая настоящая upstream-задача в embedded и edge AI."
    tag: "AI Agent · Go"
  - name: RT-Claw
    url: https://github.com/zevorn/rt-claw
    desc: "Сделать AI-ассистента дешёвым: небольшая реализация агента на C в экосистеме RT-Thread, объём кода обозрим, подходит для первого вклада в embedded-направлении."
    tag: "AI Agent · C"
  - name: LoongClaw
    url: https://github.com/loongclaw-ai/loongclaw
    desc: "Лёгкая, понятная и расширяемая инфраструктура AI-агентов на Rust с акцентом на «легко освоить, можно менять что угодно»."
    tag: "AI Agent · Rust"
  - name: Buddy Compiler / Buddy MLIR
    url: https://github.com/buddy-compiler/buddy-mlir
    desc: "Компиляторный фреймворк на основе MLIR, соединяющий DSL с DSA. Одно из основных мест практики для стажёров направления MLIR."
    tag: "Компиляторы · MLIR"
  - name: FlagTree
    url: https://github.com/flagos-ai/FlagTree
    desc: "Единый компилятор с поддержкой разных бэкендов AI-чипов, ориентирован на собственные операторы глубокого обучения; работа над бэкендом RISC-V в системе FlagOS идёт именно здесь."
    tag: "Компиляторы · AI Infra"
  - name: TileLang
    url: https://github.com/tile-ai/tilelang
    desc: "Предметно-ориентированный язык для разработки высокопроизводительных ядер на GPU/CPU/ускорителях: операторы пишутся так же просто, как на Python."
    tag: "DSL · Kernel"
