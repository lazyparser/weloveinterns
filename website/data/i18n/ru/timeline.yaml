- date: 2017
  title: Хранилище эпохи робототехники
  desc: "254 коммита за год — пик за всю историю репозитория. Содержание целиком про роботов, AI и ROS: MACE, GluonCV, opencv.js, YOLO-in-Android, TensorRT, распознавание речи на PocketSphinx, сжатие моделей глубокого обучения. Каталог правил оформления кода называется droid_coding_norm."
  kind: repo
  evidence: MACE/ · gluoncv_0.2/ · opencv.js/ · droid_coding_norm/

- date: 2018-2019
  title: Первая партия оценок стажёров
  desc: "В репозитории начали появляться целые отчёты о стажировках: интеграция синтеза речи на стороне Android, взаимодействие ROS Server с Android, данные ScanNet, развёртывание CNNdroid. Сегодняшняя система «внешне видимых результатов» выросла именно из этих отчётов."
  kind: repo
  evidence: Reports/ · reports/

