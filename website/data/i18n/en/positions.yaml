- id: B179
  title: Virtualisation and real-time operating system development intern
  badge: 2 places open
  org: Member organisation (the repository does not name the provider)
  track: partner
  mode: Not stated
  location: Not stated
  level: LV3 and above
  stipend: Not stated
  slots: '2'
  status: open
  desc: 'On domestic ARM SoC platforms: porting, adaptation and real-time tuning of virtualisation and real-time operating systems. You will work at all three layers at once — hypervisor, RTOS kernel and Linux drivers.'
  duties:
  - 'Bao Hypervisor platform adaptation: complete bootstrap, interrupt controllers, memory and cache partitioning, device passthrough and VirtIO backends on Renesas, NXP and Rockchip MCUs, and develop and use the platform BSP/MCAL.'
  - 'RTOS kernel porting: enable the MMU and a user-mode process model, and establish address-space isolation between processes.'
  - 'ARM platform driver development: driver adaptation on both the Linux and RTOS sides, plus design and implementation of cross-core communication channels (mailbox / shared memory).'
  - 'Mixed AMP and virtualisation deployment: the A-core side runs the hypervisor hosting Linux and an RTOS side by side, while the R-core side carries hard real-time tasks; responsible for resource isolation between the two domains (including cache / NPU partitioning) and the boot flow.'
  - 'Real-time measurement and tuning: microsecond-level measurement of context-switch time, interrupt response and control-loop jitter; establish reproducible test methods and publish the data.'
  - 'Landing Rust in the RTOS: give the RTOS the ability to run Rust applications and middleware (std library, async mechanisms), and migrate kernel modules to Rust step by step (good to have).'
  - Static code analysis and certification-related coding standards (good to have).
  reqs:
  - LV3 and above, with a strong interest in low-level computer programming;
  - Proficient in C and assembly;
  - Familiar with Linux kernel and driver development; experience with Linux driver development on ARM platforms is a plus;
  - Familiar with at least one RTOS (RT-Thread / FreeRTOS / Zephyr and so on) and understand the POSIX interface model;
  - Knowledge of operating systems, scheduling and real-time systems, and understanding of how real-time metrics are defined and measured;
  - 'Solid computer architecture and processor knowledge: ARMv8-A / ARMv8-R, exception levels, MMU / MPU, GIC, cache coherency;'
  - Proficient with small tools such as Git, SSH and bash scripts to work efficiently;
  - Basic understanding of hardware debug interfaces and debuggers (JTAG / serial port / logic analyser / oscilloscope);
  - A bachelor's or master's degree in computer engineering, electrical engineering or computer science.
  bonus:
  - Rust, especially embedded or no_std work;
  - Exposure to any virtualisation solution (Bao / Jailhouse / Xen / KVM);
  - Hands-on experience with heterogeneous multi-core AMP architectures and inter-core communication;
  - Experience with the development processes behind functional safety or self-controlled certification;
  - Experience with static analysis tools (MISRA C, Coverity, clang-analyzer and so on);
  - A record of open-source community contributions.
  gains:
  - Chip platform adaptation on real production projects, the full hypervisor and RTOS porting chain, and engineering Rust in safety-critical systems — this work goes straight into a customer's Safety Critical products; these are not practice projects.
