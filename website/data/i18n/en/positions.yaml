- id: A180
  title: Embedded virtualisation / hypervisor intern
  org: Jincheng Shiming Technology Co., Ltd.
  track: partner
  mode: On-site
  location: Shanghai (preferred) · Beijing
  level: Not stated (undergraduate or postgraduate, currently enrolled)
  stipend: Not stated
  slots: ''
  status: open
  desc: This position is from Jincheng Shiming Technology Co., Ltd. Only on-site internships (Shanghai) are accepted. More recruitment information from the company is available at the address below.
  duties:
  - Take part in the development, debugging and testing of core embedded hypervisor features, including VM / vCPU, memory management, interrupts and device virtualisation.
  - Take part in adaptation to architectures such as ARM64 and RISC-V64, analysing and solving low-level problems in privilege levels, exceptions, interrupts and address translation.
  - Carry out research on virtualisation, RTOS, CPU architecture and related technical directions, reading papers, specifications, open-source implementations and community material, and turning it into technical surveys, design proposals and verification conclusions.
  - Use QEMU, GDB, the shell and trace tools for system debugging, experimental verification and problem localisation.
  - Take part in open-source community collaboration, completing upstream contributions such as issue analysis, patch development and code review.
  - Use AI agents to assist with code analysis, technical research, development, debugging and testing, and be able to verify and improve the agent's output independently.
  reqs:
  - An undergraduate or postgraduate student in computer science, software, electronics, automation, communications or a related field.
  - Familiar with C, with basic Linux development ability and able to use tools such as Git and the shell.
  - Understand basic operating-system concepts such as threads, interrupts, virtual memory, the MMU and exception handling.
  - Some research ability, able to find and read English technical material, papers, architecture manuals and open-source code on your own, and to verify your analysis and judgement experimentally.
  - Good code-reading, problem-decomposition and self-learning ability, with an interest in embedded systems, CPU architecture or virtualisation.
  - Practical experience with AI agents / coding agents, able to use an agent as an engineering and research tool rather than relying on "wishful programming".
  - At least 3 days of internship per week, for no less than 3 months.
  bonus:
  - Experience with RTOS, the Linux kernel, bootloaders, drivers or other low-level system development.
  - Understanding of the ARM64 / RISC-V privileged architecture, page tables, interrupts or hardware virtualisation mechanisms.
  - Have used QEMU, GDB, devicetree, Kconfig, CMake or Python.
  - Exposure to a hypervisor, KVM, Xen, IOMMU/SMMU or device virtualisation.
  - Experience reproducing papers, technical research, benchmark / experiment design or system prototype implementation.
  - Open-source contributions, or coursework / personal projects in systems software.
  gains:
  - Work on the core features of a real embedded hypervisor, not peripheral demos.
  - Go deep into RTOS, CPU virtualisation, memory isolation, device virtualisation and multi-architecture system development.
  - Practise the full technical path from research and design through prototype verification to engineering implementation.
  - Explore a way of working that combines AI agents with systems software R&D and technical research.
  - Take part in real open-source community collaboration and contribute part of the work upstream.
  links:
  - label: www.liepin.com
    url: https://www.liepin.com/company/21491191/
