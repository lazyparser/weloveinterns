- id: E174
  title: RISC-V open-source embedded system design and development
  badge: On-site internships; places on both the new-graduate engineering track and the research track
  org: ECOS team
  track: ecos
  mode: On-site
  location: Beijing · Shenzhen (some projects can choose; Xiong'an in preparation)
  level: Not stated (places on both the new-graduate engineering track and the research track)
  stipend: See the ECOS team note
  slots: ''
  status: open
  desc: 'Around RISC-V processor chips developed in-house by the ECOS team or mainstream ones on the market, design PCB boards, embedded SDKs, embedded development tools and typical application cases, and write the accompanying chip manuals and board documentation. Most chips the ECOS team releases are based on open-source processor cores and open-source EDA, with the SoC integration, physical design, tape-out, packaging and board design all done in-house. The embedded team works closely with the chip team, and you can take part in chip specification definition, SoC integration and verification. Joining ECOS to work on embedded systems, you can grow into a full-stack, high-level embedded engineer who knows both software and hardware. The embedded team has plenty of room to explore all kinds of applications and try fun things — robots, embedded games, handheld consoles, smart toys and so on.


    This position is offered by the ECOS team. For the internship requirements, stipend, salary and so on, see the ECOS team note on internships, new-graduate campus recruitment and experienced hiring.


    This position requires on-site work: you can be employed at the Institute of Computing Technology, Chinese Academy of Sciences (institute establishment, project hire or Chuangjia) or at the Beijing Institute of Open Source Chip office. Apart from a few projects with a preference, most can choose Beijing or Shenzhen. A Xiong''an office is also being added (low living costs and a good environment).'
  links:
  - label: mp.weixin.qq.com
    url: https://mp.weixin.qq.com/s/_UUNePIXV5H1q742XKVfnw
- id: E173
  title: Software and hardware system performance analysis and optimisation
  badge: On-site internships; places on both the new-graduate engineering track and the research track
  org: ECOS team
  track: ecos
  mode: On-site
  location: Beijing · Shenzhen (some projects can choose; Xiong'an in preparation)
  level: Not stated (places on both the new-graduate engineering track and the research track)
  stipend: See the ECOS team note
  slots: ''
  status: open
  desc: 'For a given algorithm or application, analyse its program behaviour, performance bottlenecks and architectural characteristics, and use high-performance computing methods — software approaches (parallel computing, vector computing, memory-access optimisation and so on), hardware-software co-design and dedicated accelerator design — to reach higher program performance with fewer hardware resources. Take the high-performance RTL simulator as an example: GSIM supports the Chisel language and is 10 times faster than Verilator, greatly improving the testing and verification efficiency of XiangShan. At present the ECOS team puts a great deal of time and effort into performance optimisation of EDA software, performance optimisation of embedded systems, and in future software optimisation on XiangShan.


    This position is offered by the ECOS team. For the internship requirements, stipend, salary and so on, see the ECOS team note on internships, new-graduate campus recruitment and experienced hiring.


    This position requires on-site work: you can be employed at the Institute of Computing Technology, Chinese Academy of Sciences (institute establishment, project hire or Chuangjia) or at the Beijing Institute of Open Source Chip office. Apart from a few projects with a preference, most can choose Beijing or Shenzhen. A Xiong''an office is also being added (low living costs and a good environment).'
  links:
  - label: mp.weixin.qq.com
    url: https://mp.weixin.qq.com/s/_UUNePIXV5H1q742XKVfnw
- id: E172
  title: ECOS Studio development
  badge: On-site internships; places on both the new-graduate engineering track and the research track
  org: ECOS team
  track: ecos
  mode: On-site
  location: Beijing · Shenzhen (some projects can choose; Xiong'an in preparation)
  level: Not stated (places on both the new-graduate engineering track and the research track)
  stipend: See the ECOS team note
  slots: ''
  status: open
  desc: 'ECOS Studio: integrates the results of the whole ECOS team into one IDE toolset, designing chips entirely with open-source EDA and open-source IP, with the whole flow open-source and publicly visible. Anyone can modify and realise their own chip design on this flow without paying expensive EDA and IP fees. Every digital module written in Verilog/Chisel/SpinalHDL/SystemVerilog can use the open-source EDA and SoC to evaluate the PPA of its design in an ASIC flow, or go for tape-out once the layout is complete. ECOS Studio comes in two forms (a local IDE and a cloud platform). So students who believe in open-source chips and are also interested in UI or web development are a very good fit.


    This position is offered by the ECOS team. For the internship requirements, stipend, salary and so on, see the ECOS team note on internships, new-graduate campus recruitment and experienced hiring.


    This position requires on-site work: you can be employed at the Institute of Computing Technology, Chinese Academy of Sciences (institute establishment, project hire or Chuangjia) or at the Beijing Institute of Open Source Chip office. Apart from a few projects with a preference, most can choose Beijing or Shenzhen. A Xiong''an office is also being added (low living costs and a good environment).'
  links:
