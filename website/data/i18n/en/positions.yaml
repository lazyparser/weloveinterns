  desc: 'Open-source EDA tools and toolchains matter to chips the way GCC/LLVM matters to the open-source software ecosystem. The ECOS team builds an open-source EDA toolchain covering the core steps of chip design — simulation and verification, logic synthesis, physical design, physical verification — to support the whole chip design flow. In this way, every student and chip enthusiast will in future be able to design their own chip with open-source software, get a layout and send it for fabrication. This is undoubtedly a huge undertaking. On open-source EDA alone, ECOS has already put in hundreds of people (since 2018) and written close to 500,000 lines of code; in 2023 it got the open-source EDA tool flow working end to end and released the iEDA project . For many years to come ECOS will keep improving open-source EDA in engineering quality, algorithm performance and runtime efficiency. Students interested in large software architecture, software engineering quality and program runtime
    efficiency are welcome to join.


