    url: https://mp.weixin.qq.com/s/_UUNePIXV5H1q742XKVfnw
- id: E171
  title: Full-time teaching assistant for the "One Student One Chip" talent programme
  badge: On-site internships; places on both the new-graduate engineering track and the research track
  org: ECOS team
  track: ecos
  mode: On-site
  location: Beijing · Shenzhen (some projects can choose; Xiong'an in preparation)
  level: Not stated (places on both the new-graduate engineering track and the research track)
  stipend: See the ECOS team note
  slots: ''
  status: open
  desc: '"One Student One Chip" (ysyx.org) is a large-scale, open, non-profit chip and systems talent programme initiated by the University of Chinese Academy of Sciences. It focuses on training students to break down and solve problems independently, and on the abilities to co-design computer hardware and software systems and to design a chip end to end. Applications are open all year, with no restriction on school, major or year. Since it started in 2019, more than 16,000 people have signed up, covering more than 1,100 universities in China and abroad. Past participants have joined leading companies in the field such as HiSilicon, Cambricon, Moore Threads, Hygon and Canaan, or gone on to further study at top institutions including CAS, Tsinghua, Peking University, HKUST and Carnegie Mellon. "One Student One Chip" has added a full-time teaching assistant position, especially suited to students who focus on deepening their technical skills, enjoy building community and like communicating
    with people. A full-time TA spends half their energy on improving their own technical strength and leading or joining open-source technical projects they are interested in, and half on passing the ECOS team''s technical experience on to more students (mentoring and organising sharing sessions and so on).


    This position is offered by the ECOS team. For the internship requirements, stipend, salary and so on, see the ECOS team note on internships, new-graduate campus recruitment and experienced hiring.


    This position requires on-site work: you can be employed at the Institute of Computing Technology, Chinese Academy of Sciences (institute establishment, project hire or Chuangjia) or at the Beijing Institute of Open Source Chip office. Apart from a few projects with a preference, most can choose Beijing or Shenzhen. A Xiong''an office is also being added (low living costs and a good environment).'
