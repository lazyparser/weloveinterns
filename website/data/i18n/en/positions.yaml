  desc: 'The "XiangShan" open-source high-performance RISC-V processor represents the highest performance level of open-source RISC-V processor cores in the world today . Its latest tape-out, "Kunminghu V2", reaches 45 points @ 3 GHz (that is, 15 points/GHz) in the SPECCPU2006 benchmark. That performance level is already enough to compete on equal terms with the ARM Neoverse N1/N2-class cores used in today''s mainstream ARM server chips (such as Kunpeng 920 and Yitian 710).


    At present the "XiangShan" team is working on the next-generation high-performance RISC-V processor core for data centres, "Kunminghu V3". This version aims at the industry''s top data-centre processor core, ARM Neoverse V2. The design target of "Kunminghu V3" is 22 points/GHz in the SPEC2006 benchmark, with a higher performance level and energy efficiency that is fully competitive, to further push RISC-V architecture breakthroughs in data centres, high-performance computing and other fields.


    The "XiangShan" team holds to a full-stack open-source philosophy: its microarchitecture documents, RTL source code and related development platform tools are all fully public on GitHub. The project has built a highly open development team and technical community, so whether you work on advanced microarchitecture, high-performance operator implementation, memory-subsystem optimisation, multi-core interconnect architecture, vector extension (RVV) or processor security, you can find a direction in "XiangShan" that you like and that fits you.


    The "XiangShan" processor is designed under the lead of the XiangShan team, with the ECOS team deeply involved in technical development and talent training.


    This position is offered by the ECOS team. For the internship requirements, stipend, salary and so on, see the ECOS team note on internships, new-graduate campus recruitment and experienced hiring.


    This position requires on-site work: you can be employed at the Institute of Computing Technology, Chinese Academy of Sciences (institute establishment, project hire or Chuangjia) or at the Beijing Institute of Open Source Chip office. Apart from a few projects with a preference, most can choose Beijing or Shenzhen. A Xiong''an office is also being added (low living costs and a good environment).'
